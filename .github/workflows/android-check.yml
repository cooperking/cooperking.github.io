name: Android app check
# Runs songs/android.apk on an emulated phone with Google Play and Chrome (_sotd/android-app/check.sh) and saves what it
# saw to _sotd/android-app/check/. Started by hand, and after each Android app build.
on:
  workflow_dispatch:
    inputs:
      api:
        description: "Android version (API level) of the phone"
        default: "34"
  workflow_run:
    workflows: ["Android app"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 60
      - name: The build before this one (for the update offer)
        run: |
          prev=$(git log --format=%H -n 2 -- songs/android.apk | sed -n 2p)
          if [ -n "$prev" ]; then git show "$prev:songs/android.apk" > "$RUNNER_TEMP/old.apk" && echo "OLD_APK=$RUNNER_TEMP/old.apk" >> "$GITHUB_ENV"; fi
          ls -la "$RUNNER_TEMP"/old.apk || echo "no earlier build here"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on a phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '34' }}
          target: playstore
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash _sotd/android-app/check.sh
      - name: Save what it saw
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A _sotd/android-app/check
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Android app check (API ${{ inputs.api || '34' }})"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1
