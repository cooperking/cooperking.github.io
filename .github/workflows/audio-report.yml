name: Song report

# What John's own songs (the members' MP3s) are, for streaming: bitrate, VBR or CBR, seek header, tag size, cover
# picture, length, and each one's length beside its video's (see _sotd/audio_report.py). Read-only on the bucket;
# saves _sotd/data/audio-report.json. Started by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet boto3
      - name: Read every song
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python _sotd/audio_report.py
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add _sotd/data/audio-report.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Song report: what John's own songs are"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1
