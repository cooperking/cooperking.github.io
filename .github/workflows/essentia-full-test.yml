name: Essentia full-file script test

on:
  push:
    branches: [main]
    paths: [".github/workflows/essentia-full-test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m venv ~/essentia-env && ~/essentia-env/bin/pip install -q essentia-tensorflow==2.1b6.dev1389 numpy
      - name: Sample files in three formats
        run: |
          mkdir -p ~/Music/SOTD/sub
          curl -fsSL -o ~/Music/SOTD/one.mp3 https://p.scdn.co/mp3-preview/adf602c026ab98b4f4aa2bde5299ac5b9b79307d
          curl -fsSL -o /tmp/two.mp3 https://p.scdn.co/mp3-preview/17c23f68316395c80a603af24443fb73c5a2d13d
          ffmpeg -loglevel error -i /tmp/two.mp3 -c:a aac ~/Music/SOTD/sub/two.m4a
          ffmpeg -loglevel error -i /tmp/two.mp3 ~/Music/SOTD/three.flac
          touch ~/Music/SOTD/locked.m4p
      - name: Run like the Mac command, twice
        run: |
          ~/essentia-env/bin/python _sotd/essentia_full.py ~/Music/SOTD ~/Music/SOTD-essentia
          ~/essentia-env/bin/python _sotd/essentia_full.py ~/Music/SOTD ~/Music/SOTD-essentia
      - name: Check the output
        run: |
          python - <<'PY'
          import csv, gzip, os
          o = os.path.expanduser('~/Music/SOTD-essentia/')
          rows = list(csv.reader(open(o + 'averages.csv', encoding='utf-8-sig')))
          assert len(rows) == 4, rows
          assert len(rows[0]) == 5 + 56 + 400 + 2 * 5 + 2, len(rows[0])
          g = list(csv.reader(gzip.open(o + 'per-patch/mood_happy-discogs-effnet-1.csv.gz', 'rt')))
          assert g[0] == ['file', 'patch', 'happy', 'non_happy'], g[0]
          assert len({r[0] for r in g[1:]}) == 3
          print(rows[0][:8]); print([r[:6] for r in rows[1:]]); print(len(g) - 1, 'happy patch rows')
          print(open(o + 'README.txt').read())
          PY
