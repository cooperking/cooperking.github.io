name: Song facts signed off

# Puts what John has signed off on songs/facts-admin.html on the calendar: fetches it from the Cloudflare Worker,
# which starts this job each time he signs off, and updates songs/facts.json, the draft's copy and the list still
# waiting. Where he changed a day's moods, genres or video, they go into his own files (john.json, john-videos.json)
# and this job starts song-tags.yml to rebuild the calendar's moods and videos from them.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: facts
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Put the signed-off facts live
        run: python _sotd/facts_apply.py

      - name: Save changes
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add songs/facts.json songs/facts-pending.json songs/draft/facts.json songs/facts-quotes.json _sotd/data/facts-pending.json _sotd/data/facts-quotes.json _sotd/data/john.json _sotd/data/john-videos.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          if git diff --cached --name-only | grep -qE '_sotd/data/john(-videos)?\.json'; then echo "retag=true" >> "$GITHUB_OUTPUT"; fi
          git commit -m "Signed off by John: facts$(git diff --cached --name-only | grep -qE 'john(-videos)?\.json' && echo ', moods, genres or video')"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1

      - name: Rebuild the calendar's moods and videos
        if: steps.save.outputs.retag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run song-tags.yml --ref main
