name: iPhone app, public link
# The family's TestFlight group (SOTD), hourly (_sotd/ios-app/public_link.py): the newest build goes to Beta App Review
# once the one before is through, and once Apple has approved a build, the group's public link is turned on and put in
# songs/ios.json, where invitations find it. Once both are done, this turns itself off (Actions > iPhone app, public
# link > Enable workflow, to have it look again, e.g. after a new build).
on:
  workflow_dispatch:
  schedule:
    - cron: '41 * * * *'

concurrency:
  group: ios-link
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The newest build to review, and the public link once Apple has approved a build
        id: link
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet pyjwt cryptography
          python _sotd/ios-app/public_link.py songs/ios.json
      - name: Into the site
        run: |
          if [ -n "$(git status --porcelain songs/ios.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add songs/ios.json
            git commit -m "iPhone app: TestFlight's public link, for invitations"
            for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && break; sleep 5; done
          fi
      - name: Off once there's nothing left to do
        if: steps.link.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable ios-link.yml -R "$GITHUB_REPOSITORY" && echo "::notice title=iPhone app (public link)::The link is in the site and the newest build is with Apple: this workflow is off now."

