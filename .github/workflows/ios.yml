name: iPhone app
# Builds the iPhone app (_sotd/ios-app) on one of GitHub's Macs and, with the Apple keys in place, sends it to
# TestFlight. Run by hand (Actions > iPhone app > Run workflow), when the app's own files change, and on the 1st of
# every second month, so the testers always have a build well inside TestFlight's 90 days.
on:
  workflow_dispatch:
    inputs:
      testflight_only:
        description: "A build number already uploaded: only hand that one to the testers (no new build)"
        default: ""
  push:
    branches: [main]
    paths: ['_sotd/ios-app/**', '.github/workflows/ios.yml']
  schedule:
    - cron: '23 4 1 */2 *'

concurrency:
  group: ios-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.testflight_only }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the Apple keys (says which secret is wrong, never its value)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/py" && "$RUNNER_TEMP/py/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/py/bin/python" _sotd/ios-app/asc_check.py
      - name: Xcode 26 (App Store Connect takes only apps built with the iOS 26 SDK or later)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$X" ]; then echo "::error title=iPhone app::No Xcode 26 on this runner: $(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice title=iPhone app::Building with $(xcodebuild -version | tr '\n' ' ')"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make the Xcode project
        working-directory: _sotd/ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          bash customise.sh
          npx cap sync ios
      - name: Build, and send to TestFlight when the Apple keys are there
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}   # (signing.py keeps the distribution certificate in R2)
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash _sotd/ios-app/build.sh

  # the build handed to the testers once Apple has processed it: What to Test, the external group (the family's), and
  # Beta App Review for them (_sotd/ios-app/testflight.py); on Linux, as it's mostly waiting
  testflight:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.testflight_only != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Hand the build to the testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUILD: ${{ inputs.testflight_only || github.run_number }}
        run: |
          pip install --quiet pyjwt cryptography
          python _sotd/ios-app/testflight.py "$BUILD"
