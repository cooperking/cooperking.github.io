name: Originals, delete

# Deletes the originals of John's own songs and videos that have a copy played in their place (see
# _sotd/media_originals.py), to save room in the R2 bucket. By hand only. Without "delete" typed in the box it only says
# what it would delete. What it did shows at the top of the run's page.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type delete to delete them (left empty: only say what would go)"
        default: ""

permissions:
  contents: read

concurrency:
  group: media-originals
  cancel-in-progress: false

jobs:
  originals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          for i in 1 2 3; do timeout 300 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg > /dev/null && break; echo "apt stuck or failed (try $i)"; sleep 10; done   # (a run once hung here 30 minutes)
          which ffprobe
          pip install --quiet boto3
      - name: Originals
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$(echo "$CONFIRM" | tr -d ' ' | tr A-Z a-z)" = "delete" ]; then python _sotd/media_originals.py --delete; else python _sotd/media_originals.py; fi
