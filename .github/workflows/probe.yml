name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          a=$(curl -s -i -A "SongOfTheDayCalendar/1.0 (https://cooperking.github.io/songs/)" "https://api.song.link/v1-alpha.1/links?url=https%3A%2F%2Fopen.spotify.com%2Ftrack%2F5mgCP62kIGit9ICUdaqIgq&userCountry=GB" | head -c 1200 | tr '\r\n' '  ')
          echo "::notice title=songlink::$a"
          b=$(curl -s -i "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=dQw4w9WgXcQ&format=json" | head -c 500 | tr '\r\n' '  ')
          echo "::notice title=oembed::$b"
