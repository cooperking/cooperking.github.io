name: Song moods and genres

# Listens to new songs on John's Song of the Day, gathers listener tags and MusicBrainz genres,
# and rebuilds songs/tags.json for the calendar at cooperking.github.io/songs/.
# No timer: the Cloudflare Worker (sotd-playlists) starts it when it sees the Spotify playlist has changed,
# and a push to the code here starts it too. At the end it starts Claude's facts task for any new song (facts_ask.py).
on:
  workflow_dispatch:
    inputs:
      facts_redo:
        description: "A song already out (its Spotify track id): have its facts written again (the Songs tab's Write facts again)"
        default: ""
      redo:
        description: "Re-analyse every song's audio"
        type: boolean
        default: false
      ask_facts:
        description: "Start Claude's facts task even if no song needs facts (to test the link)"
        type: boolean
        default: false
      web_again:
        description: "Members' songs the web searches missed this week: searched again now, worded differently"
        type: boolean
        default: false
  push:
    branches: [main]
    # (not the calendar page, the Worker, the notes or the Playlist push script: those don't need it, and a push of one
    # bumped the run waiting to start, so members' playlists went unprepared: John, 1 Nov 2026)
    paths: ["_sotd/**", ".github/workflows/song-tags.yml", "!_sotd/web/**", "!_sotd/worker/**", "!_sotd/*.md", "!_sotd/playlist-push/**"]

permissions:
  contents: write

# (one at a time per job, not per run: a run's John's-songs job doesn't wait for the run before's members' playlists, so
# his new song goes out, notifications and all, minutes after his sign-off: John, 3 Nov 2026, today's waited behind
# members' videos and listening)

jobs:
  # John's own songs first, on their own (no members' playlists: the job's John-only way, as when the Worker can't
  # be read), so a new song of his is ready to sign off within minutes, not after every member's songs (John, 3 Nov 2026:
  # "Mine needs to always be the priority"). Then the members' run below, as before, which finds his already done.
  john:
    name: John's songs first
    runs-on: ubuntu-latest
    concurrency:
      group: song-tags-john
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Facts asked for again (a song already out)
        if: ${{ inputs.facts_redo != '' && inputs.facts_redo != null }}
        env:
          REDO: ${{ inputs.facts_redo }}
        run: python _sotd/facts_redo.py "$REDO"

      - name: A YouTube video for each of John's songs
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}   # (a web search for each song's video before YouTube's own; off without it)
          WEB_AGAIN: ${{ inputs.web_again && '1' || '' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python _sotd/youtube.py

      - name: The year each song first came out
        run: python _sotd/years.py

      - name: Any songs to listen to?
        id: check
        run: python _sotd/analyze_audio.py --check ${{ inputs.redo && '--all' || '' }}

      - name: Cache the Essentia models
        if: steps.check.outputs.todo != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/essentia-models
          key: essentia-models-v1

      - name: Install Essentia
        if: steps.check.outputs.todo != '0'
        run: pip install --quiet "essentia-tensorflow==2.1b6.dev1389" numpy

      - name: Listen to the previews
        if: steps.check.outputs.todo != '0'
        run: python _sotd/analyze_audio.py ${{ inputs.redo && '--all' || '' }}

      - name: Cache the Last.fm tags (kept out of the repo)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lastfm
          key: lastfm-v3-${{ github.run_id }}-john
          restore-keys: lastfm-v3-

      - name: Listener tags from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python _sotd/lastfm.py

      - name: Genres from MusicBrainz
        run: python _sotd/musicbrainz.py

      - name: Sources for the song facts (Wikipedia, Wikidata, MusicBrainz)
        continue-on-error: true
        run: python _sotd/about.py

      - name: Still pictures, from YouTube's own frames
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python _sotd/video_still.py

      - name: Keep the YouTube playlist in step
        continue-on-error: true   # (the members' run does it again)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python _sotd/youtube_playlist.py

      - name: Other uploads to offer for still-picture videos (admin page)
        run: python _sotd/video_alts.py

      - name: Weigh up moods and genres
        run: python _sotd/make_tags.py

      - name: A page and a picture per day for sharing links
        run: |   # (no members' playlists given: their cards stay as they are)
          pip install --quiet pillow numpy
          python _sotd/share_pages.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A _sotd/data songs
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Song moods and genres: John's songs first"
          for i in 1 2 3; do git pull --rebase -X theirs --quiet || { git rebase --abort 2>/dev/null; false; } && git push && exit 0; sleep 5; done   # (where both jobs changed the same lines: John's own commit kept)
          exit 1

      - name: Ask Claude for the new songs' facts
        env:
          FACTS_TASK_URL: ${{ secrets.SOTD_FACTS_URL }}
          FACTS_TASK_TOKEN: ${{ secrets.SOTD_FACTS_TOKEN }}
          FORCE: ${{ inputs.ask_facts }}
        run: |
          git pull --rebase --quiet || true
          rc=0; python _sotd/facts_ask.py || rc=$?
          git add _sotd/data/facts-asked.json _sotd/data/facts-task.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            if [ "$rc" = 0 ]; then git commit -m "Asked Claude for the new songs' facts"; else git commit -m "The facts task couldn't be started"; fi
            pushed=0; for i in 1 2 3; do if git pull --rebase --quiet && git push; then pushed=1; break; fi; sleep 5; done
            [ "$pushed" = 1 ] || exit 1
          fi
          if [ "$rc" != 0 ]; then echo "::error title=Facts task not started::$(python -c 'import json; print(json.load(open("_sotd/data/facts-task.json"))["said"])')"; fi
          exit "$rc"

      - name: Tell the members' phones when a new song is out
        if: ${{ !cancelled() }}
        run: python _sotd/push_live.py

  tags:
    name: Then the members' playlists
    needs: john
    concurrency:
      group: song-tags-members
      cancel-in-progress: false
    if: ${{ !cancelled() }}   # (even when John's run failed: as before, this one does his songs too)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest, even when this run waited behind another that saved data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # members' own Spotify playlists: which of their songs this run takes in (each one's 10 newest at first, then 5
      # a day, new ones at once), and the list the steps finding videos, moods and years work through (John's, then theirs)
      # what was found for their songs is kept in the Worker, not in this repository (upl_private.py): back in first;
      # without it, their songs are left out this run
      - name: Members' playlists, their songs this run
        continue-on-error: true   # without it those steps take John's songs alone
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if python _sotd/upl_private.py load; then
            python _sotd/upl_sync.py "$RUNNER_TEMP/songs-all.json"
          else
            GITHUB_TOKEN= python _sotd/upl_sync.py "$RUNNER_TEMP/songs-all.json"
          fi
          echo "SOTD_ALL=file://$RUNNER_TEMP/songs-all.json" >> "$GITHUB_ENV"
          if [ -f "$RUNNER_TEMP/songs-facts.json" ]; then echo "SOTD_FACTS=file://$RUNNER_TEMP/songs-facts.json" >> "$GITHUB_ENV"; fi
          python _sotd/upl_facts.py send

      # the videos first, ahead of the listening, moods and years (slow), and members' sent to the Worker straight
      # away, so each playlist's YouTube list (the Playlist push sheet) has them within minutes (John, 1 Nov 2026)
      - name: The free ways to find videos, answering?
        continue-on-error: true   # (only a look: the next step carries on either way)
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}   # (a web search for each song's video before YouTube's own; off without it)
          WEB_AGAIN: ${{ inputs.web_again && '1' || '' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python _sotd/free_videos.py --check
      # members' songs: the free ways first (free_videos.py: Wikidata, MusicBrainz, then Discogs once John adds the
      # DISCOGS_TOKEN secret), so YouTube's search on his account goes on the songs those miss, after his own
      - name: A YouTube video for each song
        env:
          GITHUB_TOKEN: ${{ github.token }}   # (its progress to the Worker, for John on the calendar)
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}   # (a web search for each song's video before YouTube's own; off without it)
          WEB_AGAIN: ${{ inputs.web_again && '1' || '' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOTD_SONGS_URL: ${{ env.SOTD_ALL || 'https://sotd-playlists.cooperking.workers.dev/songs.json' }}
        run: python _sotd/youtube.py

      # the years next (members' songs mostly from their release date: quick), then sent with the videos; the
      # moods last of all (John, 1 Nov 2026: "Moods should be a last check")
      - name: The year each song first came out
        env:
          SOTD_SONGS_URL: ${{ env.SOTD_ALL || 'https://sotd-playlists.cooperking.workers.dev/songs.json' }}
        run: python _sotd/years.py

      - name: Members' videos and years to the Worker now
        continue-on-error: true   # (the end of the run sends them anyway)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python _sotd/upl_vids.py

      - name: Any songs to listen to?
        id: check
        env:
          SOTD_SONGS_URL: ${{ env.SOTD_ALL || 'https://sotd-playlists.cooperking.workers.dev/songs.json' }}
        run: python _sotd/analyze_audio.py --check ${{ inputs.redo && '--all' || '' }}

      - name: Cache the Essentia models
        if: steps.check.outputs.todo != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/essentia-models
          key: essentia-models-v1

      - name: Install Essentia
        if: steps.check.outputs.todo != '0'
        run: pip install --quiet "essentia-tensorflow==2.1b6.dev1389" numpy

      - name: Listen to the previews
        if: steps.check.outputs.todo != '0'
        env:
          SOTD_SONGS_URL: ${{ env.SOTD_ALL || 'https://sotd-playlists.cooperking.workers.dev/songs.json' }}
        run: python _sotd/analyze_audio.py ${{ inputs.redo && '--all' || '' }}

      - name: Cache the Last.fm tags (kept out of the repo)
        uses: actions/cache@v4
        with:
          path: ~/.cache/lastfm
          key: lastfm-v3-${{ github.run_id }}
          restore-keys: lastfm-v3-

      - name: Listener tags from Last.fm
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          SOTD_SONGS_URL: ${{ env.SOTD_ALL || 'https://sotd-playlists.cooperking.workers.dev/songs.json' }}
        run: python _sotd/lastfm.py

      - name: Genres from MusicBrainz
        env:
          SOTD_SONGS_URL: ${{ env.SOTD_ALL || 'https://sotd-playlists.cooperking.workers.dev/songs.json' }}
        run: python _sotd/musicbrainz.py

      - name: Sources for the song facts (Wikipedia, Wikidata, MusicBrainz)
        continue-on-error: true   # the facts can wait for the next run; the rest still saves
        env:   # (John's songs, and those on members' public playlists wanting facts)
          SOTD_SONGS_URL: ${{ env.SOTD_FACTS || 'https://sotd-playlists.cooperking.workers.dev/songs.json' }}
        run: python _sotd/about.py

      # whether each video is only a still picture, from YouTube's own three frames of it (the admin page's Still picture)
      - name: Still pictures, from YouTube's own frames
        continue-on-error: true   # tried again next run
        run: |
          pip install --quiet pillow
          python _sotd/video_still.py

      - name: Keep the YouTube playlist in step
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python _sotd/youtube_playlist.py
          python _sotd/youtube_upl_drop.py || echo "deleted playlists' YouTube copies: left for the next run"

      - name: Other uploads to offer for still-picture videos (admin page)
        run: python _sotd/video_alts.py

      - name: Weigh up moods and genres
        env:
          SOTD_SONGS_URL: ${{ env.SOTD_ALL || 'https://sotd-playlists.cooperking.workers.dev/songs.json' }}
        run: python _sotd/make_tags.py

      - name: A page and a picture per day for sharing links
        env:
          SOTD_UPL_PLAYLISTS: ${{ runner.temp }}/upl-playlists.json
        run: |
          pip install --quiet pillow numpy
          python _sotd/share_pages.py

      - name: The app icons in this month's colours (when the month changes)
        run: python _sotd/icons.py

      # whether the draft and the live calendar are what the template builds (the admin page's Status tab shows it)
      - name: Draft and live, against the template
        run: python _sotd/web/pages_check.py

      - name: Members' songs out of the repository, to the Worker
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python _sotd/upl_facts.py tidy "$RUNNER_TEMP/upl-playlists.json"
          python _sotd/upl_private.py save

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A _sotd/data songs
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Song moods and genres: update from the latest songs"
          for i in 1 2 3; do git pull --rebase -X ours --quiet || { git rebase --abort 2>/dev/null; false; } && git push && exit 0; sleep 5; done   # (where both jobs changed the same lines: John's job's, already in, kept; the members' songs are saved in the Worker a step before)
          exit 1

      # a new song's facts: Claude's facts task, started now (its sources are saved), not on a timer; the song shows on
      # the live calendar once they're written and checked (_sotd/released.py)
      - name: Ask Claude for the new songs' facts
        env:
          FACTS_TASK_URL: ${{ secrets.SOTD_FACTS_URL }}
          FACTS_TASK_TOKEN: ${{ secrets.SOTD_FACTS_TOKEN }}
          FORCE: ${{ inputs.ask_facts }}
        # (a call that fails is kept for the admin page's Status tab, then fails this step, so the run shows as failed)
        run: |
          git pull --rebase --quiet || true
          rc=0; python _sotd/facts_ask.py || rc=$?
          git add _sotd/data/facts-asked.json _sotd/data/facts-task.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            if [ "$rc" = 0 ]; then git commit -m "Asked Claude for the new songs' facts"; else git commit -m "The facts task couldn't be started"; fi
            pushed=0; for i in 1 2 3; do if git pull --rebase --quiet && git push; then pushed=1; break; fi; sleep 5; done
            [ "$pushed" = 1 ] || exit 1
          fi
          if [ "$rc" != 0 ]; then echo "::error title=Facts task not started::$(python -c 'import json; print(json.load(open("_sotd/data/facts-task.json"))["said"])')"; fi
          exit "$rc"

      # a song just out on the calendar: its notification to the members now, once the live site shows it (push_live.py)
      - name: Tell the members' phones when a new song is out
        if: ${{ !cancelled() }}
        run: python _sotd/push_live.py
