name: Fire TV app check

# Runs songs/tv.apk in an Android TV emulator and works it with remote-control keys, saving a screenshot after
# each step and the app's log to _tvapp/check/. Started by hand.
on:
  workflow_dispatch:
    inputs:
      api:
        description: "Android version (API level) of the TV emulator"
        default: "34"
      script:
        description: "What to check: check.sh (the app with the remote) or check_update.sh (the update check)"
        default: "check.sh"

permissions:
  contents: write

concurrency:
  group: tv-app
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        if: inputs.script == 'check_update.sh'
        with:
          distribution: temurin
          java-version: "17"

      - name: An old build (version 1) to update from, with the real key
        if: inputs.script == 'check_update.sh'
        env:
          SEED: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          pip install --quiet "cryptography>=44"
          export KS_PASS="$(openssl rand -hex 16)" KEYSTORE="$RUNNER_TEMP/tv.p12" VERSION_CODE=1
          python _tvapp/make_key.py "$KEYSTORE"
          bash _tvapp/build.sh
          rm -f "$RUNNER_TEMP/tv.p12"

      - name: Run the app with the remote
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api }}
          target: android-tv
          arch: x86
          profile: tv_1080p
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash _tvapp/${{ inputs.script }}

      - name: Save what it saw
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A _tvapp/check
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Fire TV app check (API ${{ inputs.api }})"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1
