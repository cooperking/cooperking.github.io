name: Videos for the TV

# A TV-friendly H.264 copy of each of John's own videos that needs one (see _sotd/video_tv.py). Started by the Worker
# after each video upload (that one video), by hand (all of them), and once a day to catch anything missed.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "One song's track id (empty: every video that needs a copy)"
        default: ""
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: video-tv-${{ inputs.track || 'all' }}
  cancel-in-progress: false

jobs:
  copies:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.track && '[1]' || '[1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          # ffmpeg: apt, briefly (it has hung, and failed three runs in a row on 6 Nov 2026); else a ready-made static build (else one through pip)
          for i in 1 2; do timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null 2>&1 && break; timeout 150 sudo apt-get update -qq > /dev/null 2>&1; echo "apt stuck or failed (try $i)"; done
          if ! command -v ffprobe > /dev/null; then
            echo "apt didn't give ffmpeg: the ready-made one instead"
            d="$RUNNER_TEMP/ffmpeg"; mkdir -p "$d"
            if curl -fsSL --retry 3 -m 300 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C "$d" --strip-components=1; then :
            else pip install --quiet static-ffmpeg && d=$(python -c "import os, static_ffmpeg.run as r; print(os.path.dirname(r.get_or_fetch_platform_executables_else_raise()[0]))"); fi
            echo "$d" >> "$GITHUB_PATH"; export PATH="$d:$PATH"
          fi
          which ffprobe
          pip install --quiet boto3
      - name: Make the copies
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRACK: ${{ inputs.track }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$TRACK" ]; then python _sotd/video_tv.py "$TRACK"; else python _sotd/video_tv.py --shard "$SHARD/4"; fi
