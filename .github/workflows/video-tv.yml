name: Videos for the TV

# A TV-friendly H.264 copy of each of John's own videos that needs one (see _sotd/video_tv.py). Started by the Worker
# after each video upload (that one video), by hand (all of them), and once a day to catch anything missed.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "One song's track id (empty: every video that needs a copy)"
        default: ""
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: video-tv-${{ inputs.track || 'all' }}
  cancel-in-progress: false

jobs:
  copies:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.track && '[1]' || '[1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          for i in 1 2 3; do timeout 300 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg > /dev/null && break; echo "apt stuck or failed (try $i)"; sleep 10; done   # (a run once hung here 30 minutes)
          which ffprobe
          pip install --quiet boto3
      - name: Make the copies
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRACK: ${{ inputs.track }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ -n "$TRACK" ]; then python _sotd/video_tv.py "$TRACK"; else python _sotd/video_tv.py --shard "$SHARD/4"; fi
