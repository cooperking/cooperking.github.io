name: Widgets check
# The apps' widgets, checked before a build goes out: the iPhone app built for the simulator (it compiles, nothing
# signed or sent), pictures of the iPhone widgets drawn on a Mac from their own views (_sotd/ios-app/shots), and the
# Android app built with a page showing its widgets, run on an emulated phone for pictures of them, its widget
# settings and its Quick Settings tile (_sotd/android-app/widget-shots.sh). The pictures are saved, on the branch it
# ran on, to _sotd/widget-shots/. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widgets-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make the Xcode project
        working-directory: _sotd/ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          bash customise.sh
          npx cap sync ios
      - name: Build for the simulator
        env:
          SIMULATOR_ONLY: '1'
        run: bash _sotd/ios-app/build.sh

  ios-shots:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "$X/Contents/Developer"
      - name: Draw the widgets
        run: |
          W=_sotd/ios-app/native/SotdWidget
          swiftc -parse-as-library -O -target arm64-apple-macos14.0 -o "$RUNNER_TEMP/shots" $W/SotdModel.swift $W/SotdViews.swift _sotd/ios-app/shots/main.swift
          rm -rf _sotd/widget-shots/ios && "$RUNNER_TEMP/shots" _sotd/widget-shots/ios _sotd/widget-shots/days.json
      - name: Save the pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A _sotd/widget-shots/ios
          git diff --cached --quiet && exit 0
          git commit -m "Widgets check: the iPhone widgets' pictures [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1

  android-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make and build the app, with its widgets' page
        working-directory: _sotd/android-app
        env:
          WIDGET_PREVIEW: '1'
        run: |
          npm install --no-audit --no-fund
          node make.js
          cd project && chmod +x gradlew && ./gradlew --no-daemon -q assembleDebug
          ls -la app/build/outputs/apk/debug/
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The widgets on a phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash _sotd/android-app/widget-shots.sh _sotd/android-app/project/app/build/outputs/apk/debug/app-debug.apk https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/_sotd/widget-shots/days.json
      - name: Save the pictures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A _sotd/widget-shots/android
          git diff --cached --quiet && exit 0
          git commit -m "Widgets check: the Android widgets' pictures [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1
