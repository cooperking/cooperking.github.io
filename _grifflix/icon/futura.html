<!doctype html><html><head><meta charset="utf-8">
<!-- the icon in John's Futura (8 Nov 2026: "the Grifflix font is much preferable"): black, so on a Fire Stick the square icon
     melts into the black of the space it's given; GRIFFLIX in Futura Bold, and under it one bright line (John, 8 Nov 2026: "I don't like the coloured line - one bright line would do") .
     Futura isn't on GitHub: copy futura-bold-webfont.woff2 into fonts/ (git-ignored) before rendering. -->
<style>
@font-face { font-family: F; font-weight: 700; src: url(fonts/futura-bold-webfont.woff2) format("woff2"); }
html, body { margin: 0; background: #000; }
.i { position: relative; width: var(--w, 512px); height: var(--h, 512px); background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.w { font: 700 var(--fs, 50px)/1 F; letter-spacing: .55em; margin-right: -.55em; color: #fff; }   /* (the spacing of the name on the site: John, 8 Nov 2026) */
.c { display: flex; width: var(--cw, 380px); height: var(--ch, 10px); margin-top: var(--cg, 34px); }
.c i { flex: 1; }
</style></head>
<body><div class="i" id="i"><div class="w" id="t">GRIFFLIX</div><div class="c">
<i style="background:#ff2a2a"></i>
</div></div>
<script>
var q = new URLSearchParams(location.search), s = document.getElementById('i').style;
['w', 'h', 'fs', 'cw', 'ch', 'cg'].forEach(function (k) { if (q.get(k)) s.setProperty('--' + k, q.get(k)); });
if (q.get('t')) { var t = document.getElementById('t'); t.textContent = q.get('t'); t.style.letterSpacing = '0'; t.style.marginRight = '0'; }
document.fonts.load('700 76px F').then(function () { document.body.dataset.ready = 1; });
</script></body></html>
