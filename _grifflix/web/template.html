<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grifflix</title>
<meta name="description" content="John's films and TV for family and friends, with a Movie of the Day.">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">   <!-- (the home-screen app: the theme's colour right up behind the clock, the page kept clear of it: John, 8 Nov 2026) -->
<link rel="manifest" href="/grifflix/manifest.webmanifest">
<link rel="icon" href="/grifflix/favicon-96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/grifflix/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Hanken+Grotesk:wght@400;500;600&family=Bebas+Neue&family=Jost:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #0a0a0a;
  --fg: #fffaf5;
  --fg-2: rgba(255, 250, 245, .92);
  --kink: 255, 255, 255;   /* (the month's ink, set by the month's theme: black on its light colours, white on the rest) */
  --muted: rgba(var(--kink), .6);   /* (the quieter words readable on a light month too) */
  --faint: rgba(var(--kink), .55);
  --line: rgba(255, 255, 255, .32);
  --tile: rgba(255, 255, 255, .14);
  --tag-bg: rgba(16, 6, 16, .82);
  --tag-line: rgba(255, 255, 255, .22);
  --shadow: rgba(24, 8, 24, .34);
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --kfont: "GFutura", "futura-pt", "Futura PT", "Futura", "Jost", "Century Gothic", sans-serif;   /* (Futura itself, John's choice: Adobe's Futura PT once its kit is added, the Futura Apple devices have; Jost only until then) */
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
html.ready { transition: background-color .9s ease; }
html.loading body { visibility: hidden; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg-2); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1.5px solid var(--fg); outline-offset: 3px; }
img { display: block; }

.wrap { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); overflow-x: clip;
  --fg: rgb(var(--kink)); --fg-2: rgba(var(--kink), .72); --line: rgba(var(--kink), .3); color: var(--fg-2); }   /* (the month's ink; pop-ups keep their own) */

/* the bar along the top */
.bar-top { position: sticky; top: max(8px, env(safe-area-inset-top)); z-index: 20; display: flex; align-items: center; gap: 26px; min-height: 44px; }
.brand { margin-right: auto; padding: 0; border: 0; background: none; font: 700 15px/1 var(--kfont); letter-spacing: .55em; text-transform: uppercase; color: var(--fg); text-decoration: none; }
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 16px; border: 1px solid rgba(var(--kink), .45); background: none;
  font: 500 12px/1 var(--kfont); letter-spacing: .26em; text-transform: uppercase; color: var(--fg); text-decoration: none; white-space: nowrap; }
.pill.go, .pill.on { background: rgb(var(--kink)); color: var(--bg); border-color: rgb(var(--kink)); }
.pill svg { width: 15px; height: 15px; flex: none; }
.ico { display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid rgba(var(--kink), .45); background: none; color: var(--fg); }
.ico svg { width: 17px; height: 17px; }
.ico.big { width: 52px; height: 52px; background: rgb(var(--kink)); color: var(--bg); border-color: rgb(var(--kink)); box-shadow: 0 6px 20px var(--shadow); }
.ico.big svg { width: 20px; height: 20px; }
.bar-top .ico { display: none; }
@media (pointer: coarse) { .bar-top #refresh2 { display: none !important; } }   /* (a phone: pull down to refresh instead) */
@media (max-width: 760px) {
  .bar-top .pill { display: none; }
  .bar-top .ico { display: inline-grid; }
  .bar-top .ico svg { width: 15px; height: 15px; }
}

/* the month's heading */
.hero { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 18px; margin: 26px 4px 14px; }
.hero h1 { margin: 0; font: 700 34px/.98 var(--kfont); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); text-wrap: balance; }
.hero h1 i { font-family: var(--serif); font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg-2); }
.hsub { font: 400 21px/1.2 var(--serif); color: var(--fg-2); }
.hsub i { font-style: italic; }
.kick { flex: 0 0 100%; margin-bottom: -10px; font: 500 11.5px/1.2 var(--kfont); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 760px) {
  .hero { flex-direction: column; text-align: center; gap: 10px; margin-top: 30px; }
  .kick { margin-bottom: 0; }
}
.hbtns { display: flex; gap: 10px; align-items: center; }

/* the calendars you can look at: Movie of the Day, yours, others' */
.cals { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 4px 12px; }
.cals::-webkit-scrollbar { display: none; }
.cals .pill { flex: none; }

.monthnav { display: flex; align-items: center; gap: 6px; width: 100%; max-width: 100%; margin: 0; }
.monthnav .ms { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.monthnav .ms::-webkit-scrollbar { display: none; }
.monthnav .m { flex: none; min-width: 0; padding: 6px 10px 5px; border: 0; background: none; font: 500 12px/1 var(--kfont); letter-spacing: .26em; text-transform: uppercase; color: var(--faint); }
.monthnav .m.on { color: var(--fg); box-shadow: inset 0 -2px 0 rgb(var(--kink)); }
.monthnav .ico { width: 34px; height: 34px; flex: none; }
.monthnav .ico:disabled { opacity: .35; cursor: default; }

/* the calendar */
.cal { display: grid; gap: 10px; }
.calhead { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 12px; }
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.dow div { padding: 0 2px; font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.grid { margin-top: 10px; }
.day { position: relative; aspect-ratio: 1; min-width: 0; padding: 0; border: 0; background: none; box-shadow: inset 0 0 0 1px rgba(var(--kink), .12); overflow: hidden; text-align: left; color: var(--fg); }
.day.blank { visibility: hidden; }
.day .num { position: absolute; top: auto; left: 4px; bottom: 4px; z-index: 2; min-width: 1.9em; padding: 2px 5px 1px; border-radius: 2px; font: 500 clamp(9px, 2vw, 11px)/1.3 var(--kfont); letter-spacing: .06em; text-align: center; color: var(--muted); }
.day.has { box-shadow: none; }
.day.has .num { background: var(--tag-bg); border: 1px solid var(--tag-line); color: #fff; }   /* (on the film's picture, white whatever the month's ink) */
.day .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.day .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 7px; background: linear-gradient(to bottom, transparent, rgba(10, 4, 12, .82) 45%); }
.day .cap .t { font: 600 15px/1.12 var(--kfont); text-transform: uppercase; letter-spacing: .03em; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.day .cap .s { margin-top: 2px; font: 600 10px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--fg); z-index: 3; }
.day:not(.has):hover { background: rgba(255, 255, 255, .14); }
.day.has:hover .art { transform: scale(1.04); }
.day .art { transition: transform .4s ease; }
.day .plus { position: absolute; inset: 0; display: grid; place-items: center; font: 300 22px/1 var(--sans); color: var(--faint); opacity: 0; }
.mine .day:not(.has):hover .plus { opacity: 1; }
@media (max-width: 760px) {
  .dow, .grid { gap: 5px; }
  .dow div { text-align: center; font-size: 10px; letter-spacing: .06em; }
  .day .cap { display: none; }
}

/* rows of posters */
.rows { margin-top: 34px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; }   /* (minmax: a row of posters scrolls within itself, never widens the page: it made a phone lay the page out 1560 wide) */
.row { min-width: 0; }
.row h2, .sect h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 12px; font: 700 26px/1.1 var(--kfont); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
.sect h2 i { font-weight: 300; }
.row h2 i { font-family: var(--serif); font-weight: 400; text-transform: none; letter-spacing: 0; }
.row h2 .more { margin-left: auto; font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: none; border: 0; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(118px, 13vw, 168px); gap: 14px; overflow-x: auto; padding: 2px 4px 10px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.strip, .gridcards { align-items: start; }   /* (a card is a button, which centres what's in it: a title on two lines lifted its poster above its neighbours') */
.strip.wide { grid-auto-columns: clamp(220px, 24vw, 300px); }
.card { position: relative; min-width: 0; padding: 0; border: 0; background: none; text-align: left; scroll-snap-align: start; }
.card .pic { position: relative; aspect-ratio: 2 / 3; overflow: hidden; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 8px 22px var(--shadow); }
.strip.wide .card .pic, .card.land .pic { aspect-ratio: 16 / 9; }
.card .pic img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.card:hover .pic img { transform: scale(1.04); }
.card .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--fg); }
.card .t { margin-top: 8px; font: 600 15px/1.2 var(--kfont); text-transform: uppercase; letter-spacing: .03em; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .s { margin-top: 2px; font: 600 10px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card .noimg { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; text-align: center; font: 600 14px/1.2 var(--kfont); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2);
  background: linear-gradient(150deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .03)); }
/* a collection's cover, drawn: the month's colour and type (the page's own when it has no theme) */
.card.coll .ccov { background: var(--bg); color: rgb(var(--kink, 255, 255, 255)); border: 1.5px solid rgba(var(--kink, 255, 255, 255), .5); container-type: inline-size; box-shadow: 0 10px 24px rgba(0, 0, 0, .28); }
.card.coll .ca { position: absolute; inset: 0; width: 100%; height: 100%; fill: currentColor; stroke: currentColor; }
.card.coll .ca * { stroke: none; }
.card.coll .ca line, .card.coll .ca polyline, .card.coll .ca [fill=none] { stroke: currentColor; }
.card.coll .ca .ca-bg { fill: var(--bg); }
.card.coll .ca .ca-l { font-family: var(--tfont, "GFutura", "Futura", sans-serif); font-weight: var(--tw, 700); font-style: var(--tfs, normal); }
.card.coll .cc { position: absolute; inset: auto 0 0; height: 35%; padding: 0 7cqw 8cqw; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; text-align: center; }
.card.coll .cc small { font: 400 5.4cqw/1.2 var(--kfont, "GFutura", sans-serif); letter-spacing: .3em; text-transform: uppercase; opacity: .75; margin: 0 0 2cqw .3em; }
.card.coll .cc b { font-family: var(--tfont, "GFutura", "Futura", sans-serif); font-weight: var(--tw, 700); font-style: var(--tfs, normal); text-transform: var(--ttt, uppercase); font-size: 11cqw; line-height: 1.04; letter-spacing: .02em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card.coll .cc b.l { font-size: 8.6cqw; }
.card.coll .cc b.xl { font-size: 7cqw; }
.card.coll .cc i { display: block; width: 26%; height: 1.5px; margin: 3.6cqw 0 3cqw; background: currentColor; opacity: .7; }
.card.coll .cc span { font: 400 4.8cqw/1 var(--kfont, "GFutura", sans-serif); letter-spacing: .3em; margin-right: -.3em; text-transform: uppercase; opacity: .7; }
.gridcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 22px 16px; padding: 0 4px; }
.gridcards.land { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
@media (max-width: 760px) { .gridcards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 10px; } .gridcards.land { grid-template-columns: repeat(2, minmax(0, 1fr)); } .card .t { font-size: 13.5px; } }

.sect { margin-top: 30px; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 4px 18px; align-items: center; }
.tabs .sp { flex: 1; }
.empty { margin: 30px 4px; padding: 30px; border: 1px dashed var(--line); border-radius: 18px; text-align: center; color: var(--muted); font: italic 400 19px/1.4 var(--serif); }
select.pill { appearance: none; -webkit-appearance: none; padding-right: 16px; }
select.pill option { color: #000; }

/* pop-ups: a day, a film, a series */
dialog { border: 0; padding: 0; color: var(--fg-2); background: transparent; max-width: none; max-height: none; }
dialog::backdrop { background: rgba(10, 4, 12, .62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet { width: min(860px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); margin: auto; border: 1px solid var(--line); overflow: auto; overscroll-behavior: contain;
  background: color-mix(in srgb, var(--bg) 78%, #000); box-shadow: 0 30px 80px rgba(0, 0, 0, .55); }
.sheet .heroimg { position: relative; aspect-ratio: 16 / 8; background: #000; }
.sheet .heroimg img { width: 100%; height: 100%; object-fit: cover; opacity: .9; }
.sheet .heroimg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0, 0, 0, .25), transparent 30%, color-mix(in srgb, var(--bg) 78%, #000) 98%); }
.sheet .close { position: absolute; top: 14px; right: 14px; z-index: 3; }
.sheet .in { position: relative; z-index: 2; padding: 0 30px 30px; margin-top: -90px; }
.sheet .noimg-top { height: 70px; }
.sheet .noimg-top + .in { margin-top: 0; }
.sheet .date { font: 500 11.5px/1.2 var(--kfont); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; min-height: 28px; }
.sheet .date .dnav { width: 28px; height: 28px; flex: none; margin: 0 -2px; }
.moods { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; } .moods::-webkit-scrollbar { display: none; } .moods .pill { flex: none; } .moods select.pill { margin-left: auto; }
.shcard { margin: 6px 0 14px; } .shcard img { display: block; width: 100%; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
.shsheet .acts { display: flex; flex-wrap: wrap; gap: 10px; } .shsheet .acts a.pill { text-decoration: none; }
.sheet .date .dnav svg { width: 16px; height: 16px; }
.sheet h2 { margin: 6px 0 6px; font: 700 40px/1.05 var(--kfont); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
.sheet h2 i { font-family: var(--serif); font-weight: 400; text-transform: none; letter-spacing: 0; }
.sheet .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 12.5px/1.4 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--fg-2); }
.sheet .meta .c { padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }
.sheet .tag { margin: 12px 0 0; font: italic 400 19px/1.35 var(--serif); color: var(--fg); }
.sheet .ov { margin: 14px 0 0; max-width: 64ch; font-size: 15.5px; line-height: 1.6; color: var(--fg-2); }
.sheet .note { margin: 18px 0 0; padding: 14px 18px; border-left: 2px solid var(--fg); background: rgba(255, 255, 255, .06); border-radius: 0 12px 12px 0; font: italic 400 18px/1.45 var(--serif); color: var(--fg); }
.sheet .note b { display: block; margin-bottom: 4px; font: 600 10.5px/1.2 var(--sans); font-style: normal; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sheet .people { margin-top: 14px; font-size: 13.5px; color: var(--muted); }
.sheet .people b { color: var(--fg-2); font-weight: 500; }
html.tv .sheet .people { font-size: var(--crfs, 15px); }
.sheet .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
.sheet .acts .pill.go { min-height: 46px; padding: 0 22px; background: var(--fg); color: #1b1020; border-color: var(--fg); font-size: 13px; }
.sheet .acts .pill.go svg { width: 16px; height: 16px; }
.sheet .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.sheet .chips span { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font: 500 11px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-2); }
.sheet .owner { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.sheet .owner h3 { margin: 0; font: 600 11px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sheet textarea, .sheet input[type=text], .sheet input[type=search], .sheet input[type=date] { width: 100%; padding: 12px 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .06); color: var(--fg); font: 400 16px/1.4 var(--sans); }
.sheet textarea { border-radius: 12px; min-height: 76px; resize: vertical; font: italic 400 17px/1.45 var(--serif); }
.eps { margin-top: 24px; }
.eps .tabs { margin: 0 0 12px; }
.ep { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: start; width: 100%; padding: 10px; border: 0; background: none; text-align: left; }
.ep .pic { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: rgba(255, 255, 255, .08); }
.ep .pic img { width: 100%; height: 100%; object-fit: cover; }
.ep .pic .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--fg); }
.ep .t { font: 500 17px/1.2 var(--serif); color: var(--fg); }
.ep .s { font: 600 10.5px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ep .o { margin-top: 4px; font-size: 13.5px; line-height: 1.45; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 760px) {
  .sheet { width: 100vw; max-height: 100dvh; height: 100dvh; border: 0; }
  .sheet .in { padding: 0 18px 40px; margin-top: -60px; }
  .ep { grid-template-columns: 112px minmax(0, 1fr); padding: 8px 0; }
}
.results { display: grid; gap: 4px; margin-top: 12px; max-height: 50vh; overflow: auto; }
.res { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px; border: 0; background: none; text-align: left; }
.res .pic { aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; background: rgba(255, 255, 255, .08); }
.res .pic img { width: 100%; height: 100%; object-fit: cover; }
.res .t { font: 500 16px/1.2 var(--serif); color: var(--fg); }
.res .s { font: 600 10px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.form { padding: 30px; }
.form h2 { margin-top: 0; }

/* the player */
.player { position: fixed; inset: 0; z-index: 100; display: none; background: #000; }
.player.on { display: block; }
.player video { width: 100%; height: 100%; background: #000; }
.player .top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) 18px 30px; background: linear-gradient(rgba(0, 0, 0, .7), transparent); transition: opacity .3s; }
.player .top .t { font: 500 20px/1.2 var(--serif); color: #fff; }
.player .top #pcast { margin-left: auto; color: #fff; }
.player .top #pcast.on { background: #fff; color: #000; }
.player .top .s { font: 600 10.5px/1.3 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, .75); }
.player.idle .top { opacity: 0; pointer-events: none; }
.player .msg { position: absolute; inset: 0; display: none; place-items: center; padding: 30px; text-align: center; font: italic 400 22px/1.4 var(--serif); color: #fff; }
.player .msg.on { display: grid; }
.player .nextup { position: absolute; right: 20px; bottom: 90px; display: none; }
.player .nextup.on { display: inline-flex; }

/* the signed-out welcome, and messages */
.welcome { max-width: 620px; margin: 12vh auto 0; text-align: center; }
.welcome h1 { margin: 0; font: 700 clamp(56px, 10vw, 96px)/1 var(--kfont); letter-spacing: .04em; text-transform: uppercase; color: var(--fg); }
.welcome h1 i { font-weight: 300; }
.welcome p { margin: 18px auto 0; max-width: 46ch; font: 400 19px/1.5 var(--serif); color: var(--fg-2); }
.welcome .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }

@media (min-width: 1100px) {   /* a wide screen: the month's films beside the calendar */
  .wrap { max-width: 1400px; }
  .stage { grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
  .side { max-height: calc(100vh - 120px); overflow: auto; position: sticky; top: 90px; }
}
.rows { margin-top: 44px; }
/* html.big: a computer or the TV: the month's name, its buttons and the months in one row, then the whole calendar filling the window */
html.big .wrap { max-width: none; padding-left: 28px; padding-right: 28px; }
html.big #main.homeview { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 18px; align-items: center; }
html.big #main.homeview #hero { grid-column: 1; grid-row: 1; }
html.big #main.homeview #mnav { grid-column: 2; grid-row: 1; margin: 18px 0 0; }
html.big #main.homeview #cals { grid-column: 1 / -1; grid-row: 2; justify-content: flex-start; margin-top: 12px; }
html.big #main.homeview .stage { grid-column: 1 / -1; grid-row: 3; grid-template-columns: minmax(0, 1fr); margin-top: 12px; }
html.big #main.homeview .rows { grid-column: 1 / -1; grid-row: 4; }
html.big .side { display: none; }   /* (the month's films are on the calendar) */
html.big .hero { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-top: 18px; text-align: left; }
html.big .hero .kick { flex: 0 0 100%; margin: 0 0 -10px; }
html.big .hero h1 { white-space: nowrap; }
html.big .hbtns { margin: 0; flex-wrap: nowrap; }
html.big .hsub { font-size: 21px; white-space: nowrap; }
html.big .cal { height: var(--calh, 70vh); min-height: 420px; grid-template-rows: auto auto minmax(0, 1fr); gap: 6px; }
html.big .grid { min-height: 0; grid-auto-rows: minmax(0, 1fr); gap: 6px 8px; }
html.big .dow { gap: 6px 8px; }
html.big .day { aspect-ratio: auto; height: 100%; min-height: 0; }
html.big .day .art { object-position: 50% 50%; }
html.big .day .cap { display: block; padding: 18px 8px 6px; }
html.big .day .cap .t { font-size: 15px; }
html.big .day .num, html.big .day.has .num { top: 4px; bottom: auto; }
html.tv .cal { min-height: 300px; }
html.tv .day .cap { padding: 14px 7px 5px; }
html.tv .day .cap .t { font-size: 13px; -webkit-line-clamp: 1; }   /* (a TV: the title on one line, small, so the picture shows) */
html.tv .day .cap .s { font-size: 9px; letter-spacing: .08em; }

/* the TV (Android TV's design guide): text and buttons 5% in from each edge (64 and 36 of the page's 1280 × 720), text big

html.tv .day .num { font-size: 13px; }
html.tv .card:focus, html.tv .day:focus { transform: scale(1.1); box-shadow: 0 14px 34px rgba(0, 0, 0, .55); transition: transform .15s ease, box-shadow .15s ease; }

/* John's Futura (his web fonts, kept by the Worker for Grifflix's pages): Book, Bold, Light */
@font-face { font-family: "GFutura"; font-weight: 400; font-display: swap; src: url("https://sotd-playlists.cooperking.workers.dev/gf/futura-book-webfont.woff2") format("woff2"), url("https://sotd-playlists.cooperking.workers.dev/gf/futura-book-webfont.woff") format("woff"); }
@font-face { font-family: "GFutura"; font-weight: 700; font-display: swap; src: url("https://sotd-playlists.cooperking.workers.dev/gf/futura-bold-webfont.woff2") format("woff2"), url("https://sotd-playlists.cooperking.workers.dev/gf/futura-bold-webfont.woff") format("woff"); }
@font-face { font-family: "GFutura"; font-weight: 300; font-display: swap; src: url("https://sotd-playlists.cooperking.workers.dev/gf/futurabt-light-webfont.woff2") format("woff2"), url("https://sotd-playlists.cooperking.workers.dev/gf/futurabt-light-webfont.woff") format("woff"); }
.triallabel { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 90; padding: 5px 12px; background: #ffe600; color: #000; font: 600 11px/1.2 var(--sans); letter-spacing: .06em; text-transform: uppercase; pointer-events: auto; }
.triallabel a { color: #000; }
.bar-top .pill, .bar-top .ico { border: 0; min-height: 0; padding: 4px 0; font: 500 12px/1 var(--kfont); letter-spacing: .3em; text-transform: uppercase; }
.bar-top .pill svg { display: none; }
.bar-top .ico { width: auto; height: auto; }
html.tv .bar-top > :not(.brand) { transition: opacity .3s ease; }
html.tv.barhide .bar-top > :not(.brand) { opacity: 0; }   /* (the calendar the whole screen; the words back when you go up to them) */
/* the table is the War Room, so always black and white whatever the month (John, 8 Nov 2026: "the war room is really
   only relevant when it's black and white"); the months' colours are for the calendar */
html.table .tring { background: radial-gradient(ellipse at center, rgba(255, 255, 255, .085), rgba(255, 255, 255, .035) 55%, rgba(255, 255, 255, 0) 72%); border: 1px solid rgba(255, 255, 255, .34); box-shadow: 0 0 60px 4px rgba(255, 255, 255, .05); }
/* the War Room, so it reads as one (John, 8 Nov 2026: "it's very abstract"): the Big Board on the wall at the back, its
   bombers' paths creeping towards their targets, and the ring of lamps hung just over the table; under the bar, never on it */
.tboard { position: absolute; left: 50%; top: 104px; width: 640px; transform: translateX(-50%); pointer-events: none; opacity: .9; }
.tboard svg { display: block; width: 100%; height: auto; overflow: visible; }
.tboard .land { fill: url(#tbdots); stroke: rgba(255, 255, 255, .45); stroke-width: 1.4; }
.tboard .frame { fill: rgba(255, 255, 255, .02); stroke: rgba(255, 255, 255, .3); stroke-width: 2; }
.tboard .grid { stroke: rgba(255, 255, 255, .08); stroke-width: 1; }
.tboard .path { fill: none; stroke: #fff; stroke-width: 2.4; stroke-dasharray: 10 8; animation: tbfly 2.4s linear infinite; }
.tboard .tgt { fill: none; stroke: #fff; stroke-width: 2; animation: tbblink 1.6s steps(2) infinite; }
.tboard .lt { fill: rgba(255, 255, 255, .14); } .tboard .lt.on { fill: rgba(255, 255, 255, .85); } .tboard .lt.bl { animation: tbblink 1.2s steps(2) infinite; }
@keyframes tbfly { to { stroke-dashoffset: -36; } }
@keyframes tbblink { 50% { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { .tboard .path, .tboard .tgt, .tboard .lt.bl { animation: none; } }
.tlamp { position: absolute; left: 50%; top: 392px; width: 1000px; height: 250px; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); box-shadow: 0 0 22px 2px rgba(255, 255, 255, .22), inset 0 0 22px 2px rgba(255, 255, 255, .12); pointer-events: none; }
/* the calendar on the TV: no row for the name alone (John: "a waste of tv space"); the month's row at the top, and
   the words (Search, Browse...) back when you go up from it */
html.tv.barhide:not(.table):not(.hall) .bar-top { display: none; }
html.tv:not(.table):not(.hall) .hero::before { content: "GRIFFLIX"; font: 700 13px/1 var(--kfont); letter-spacing: .55em; color: var(--fg-2); margin-right: 8px; align-self: center; }
html.tv .day:focus, html.tv .card:focus .pic, html.tv :focus { outline: 2px solid rgb(var(--kink)) !important; outline-offset: 4px; }
/* the table, as the mock-up John chose: the whole screen, the ring of light above, the month's days round the table */
html.table #main.homeview #hero, html.table #main.homeview #mnav, html.table #main.homeview #cals, html.table #main.homeview .rows { display: none; }
html.table .bar-top { position: fixed; top: 36px; left: 64px; right: 64px; z-index: 30; }
html.table .cal { position: fixed !important; inset: 0; height: 100% !important; width: 100%; z-index: 1; }
.tmonth { position: fixed; top: 50px; right: 64px; font: 500 13px/1 var(--kfont); letter-spacing: .5em; text-transform: uppercase; color: var(--fg-2); z-index: 25; transition: opacity .3s; pointer-events: none; }
html.table:not(.barhide) .tmonth, html.hall:not(.barhide) .tmonth { opacity: 0; }
/* the corridor: the whole screen, the month's colour, the lines to the far end; the day you're on at the front */
html.hall #main.homeview #hero, html.hall #main.homeview #mnav, html.hall #main.homeview #cals, html.hall #main.homeview .rows, html.hall #main.homeview .side { display: none; }
html.hall .bar-top { position: fixed; top: 36px; left: 64px; right: 64px; z-index: 30; }
html.hall .cal { position: fixed !important; inset: 0; height: 100% !important; width: 100%; z-index: 1; display: block; overflow: hidden; padding: 0; }
.hlines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hlines line, .hlines rect { fill: none; stroke: rgba(var(--kink), .22); stroke-width: 1; vector-effect: non-scaling-stroke; }
.hlines .hend { fill: rgba(0, 0, 0, .04); stroke: rgba(var(--kink), .3); }
.hlines .hdoor { fill: rgba(0, 0, 0, .05); stroke: rgba(var(--kink), .26); stroke-width: 1; vector-effect: non-scaling-stroke; }
.hlines .r237d { fill: #000; stroke: none; }
.hlines .n237 { fill: #000; font-family: var(--tfont); font-weight: var(--tw, 400); text-anchor: middle; letter-spacing: .02em; }
.hstage { position: absolute; inset: 0; }

/* the months' themes on the TV (besides the corridor and the table): each its own way with the month's days */

.th-reel .vday { width: 240px; height: 135px; background-image: var(--b); filter: sepia(.7) brightness(.7); }

.reelband { position: absolute; left: 0; right: 0; top: calc(31% - 106px); height: 212px; background: linear-gradient(90deg, transparent 0 9px, #f4ecd8 9px 23px, transparent 23px) 0 9px / 32px 13px repeat-x, linear-gradient(90deg, transparent 0 9px, #f4ecd8 9px 23px, transparent 23px) 0 190px / 32px 13px repeat-x, #141414; transition: background-position .7s cubic-bezier(.3, .7, .2, 1); }
.reelscreen { position: absolute; right: 74px; bottom: 156px; width: 460px; height: 259px; background: #000 center/cover; box-shadow: 0 0 0 10px #000, 0 0 0 26px #2a2420, 0 0 60px 30px rgba(235, 222, 202, .25); }

  background: var(--bulb) left top / 20px 20px repeat-x, var(--bulb) left bottom / 20px 20px repeat-x, var(--bulb) left top / 20px 20px repeat-y, var(--bulb) right top / 20px 20px repeat-y; }

  if (ae && ae.closest && ae.closest('.bar-top') && VIEW() === 'themes' && S.view === 'home' && !dlg.open) {   // the bar: down back to the day you were on; up nowhere
    if (k === 'down') { e.preventDefault(); var fb = $('#cal button.front') || $('#cal .tday.has') || $('#cal button[data-day]'); if (fb) fb.focus({ preventScroll: true }); return; }
    if (k === 'up') { e.preventDefault(); return; }
  }
  if (k === 'ok' || (inText && (k === 'left' || k === 'right'))) return;   // OK presses the button (the browser's own); text keeps its own left/right
  if (k === 'up' && dlg.open && ae && (ae.id === 'sq' || (ae.closest && ae.closest('#shnav')))) { var si = $('#sheetIn'); if (si) si.scrollTo({ top: 0, behavior: 'smooth' }); }   // (up to the search box: Search's top in view again, John, 8 Nov 2026)
  e.preventDefault();
  if (!moveFocus(k) && k === 'up' && document.documentElement.classList.contains('barhide')) {   // (up from the top row: the words back)
    document.documentElement.classList.remove('barhide'); setTimeout(function () { var t = barSearch(); if (t) t.focus(); }, 0);
  }
}, true);
function barSearch() {   // up into the bar lands on Search first (John, 8 Nov 2026: "the first click up ... go to Search not calendar")
  return $('#barnav [data-nv="search"]') || $('.bar-top button');
}
window.grifflixTV = {
  key: function (k) {
    if (trailerOn()) return trailerKeys(k);
    if (P.el.classList.contains('on')) return playerKeys(k);
    if (k === 'play') {
      var it = document.activeElement && document.activeElement.closest('[data-day]'), d = S.calData && S.calData.days[it ? it.dataset.day : TODAY];
      if (d) play(d);
    }
    if ((k === 'ff' || k === 'rew') && S.view === 'home') { var b = $(k === 'ff' ? '#mnext' : '#mprev'); if (b && !b.disabled) b.click(); }
    return true;
  },
  back: function () {
    if (trailerOn()) { trailerClose(); return 'done'; }
    if (P.el.classList.contains('on')) { stopPlayer(); return 'done'; }
    if (dlg.open) {
      var bi = $('#bsin');
      if (bi && bi.dataset.coll) { delete bi.dataset.coll; browse(bi); var bt = $('#bsin [data-b].on'); if (bt) bt.focus(); return 'done'; }   // (a collection, opened in a pop-up: back to Collections)
      if (S.fromCal && $('#sheetIn .tcal') === null) { S.fromCal = false; calSheet(); return 'done'; }   // (a day opened from the month's calendar: back to it)
      closeSheet(); return 'done';
    }
    if (S.view !== 'home') { location.hash = '#home'; return 'done'; }
    if (VIEW() === 'themes') { var fr = $('#cal button.front'), ae = document.activeElement; if (fr && ae !== fr) { fr.focus({ preventScroll: true }); return 'done'; } }   // (anywhere else on the page: back to the day you're on first)
    return 'page';
  }
};
if (TV) {
  P.v.controls = false;   // (a remote can't work the browser's own controls: the bar below is the page's)
  P.v.addEventListener('timeupdate', function () { if (P.v.duration) { $('#pbar i').style.width = (P.v.currentTime / P.v.duration * 100).toFixed(2) + '%'; $('#ptime').textContent = clock(P.v.currentTime) + ' / ' + clock(P.v.duration); } });
  ['play', 'pause'].forEach(function (ev) { P.v.addEventListener(ev, function () { try { if (window.GRIFFLIXTV && GRIFFLIXTV.playing) GRIFFLIXTV.playing(ev === 'play'); } catch (x) {} wake(); }); });
  dlg.addEventListener('close', function () { setTimeout(function () { var d = $('#cal button.front') || $('.day.today'); if (d && !P.el.classList.contains('on') && !dlg.open) d.focus(); }, 30); });
}
document.addEventListener('error', function (e) { if (e.target.tagName === 'IMG') e.target.style.visibility = 'hidden'; }, true);   // (a picture the Mac mini hasn't got)
start();
})();
</script>
