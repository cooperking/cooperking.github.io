<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Grifflix Admin</title>
<!-- Grifflix's admin page as an app of its own (John, 18 Nov 2026: "I'd like to be able to save the Admin page as a separate chrome app").
     Its own address, outside /grifflix/: there, Chrome counted it part of the Grifflix app already installed, and offered only "Open in app".
     The admin page itself, shown whole inside. -->
<link rel="manifest" href="/gadmin/manifest.webmanifest">
<link rel="icon" type="image/png" href="/grifflix/admin-192.png">
<link rel="apple-touch-icon" href="/grifflix/admin-192.png">
<meta name="theme-color" content="#1c1c1e">
<style>
  html, body { margin: 0; height: 100%; background: #1c1c1e; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #inst { position: fixed; right: 16px; bottom: 16px; z-index: 2; padding: 12px 18px; border: 0; border-radius: 999px; background: #ec135b; color: #fff;
    font: 600 14px/1 -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: .04em; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
</style>
</head>
<body>
<iframe src="/grifflix/admin.html" title="Grifflix admin"></iframe>
<button id="inst" hidden>Install Grifflix Admin</button>
<script>
  var ev = null, b = document.getElementById('inst');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ev = e; b.hidden = false; });
  window.addEventListener('appinstalled', function () { b.hidden = true; });
  b.onclick = function () { if (!ev) return; ev.prompt(); ev.userChoice.then(function () { ev = null; b.hidden = true; }); };
</script>
</body>
</html>
