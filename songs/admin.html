<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Song of the Day admin</title>
<link rel="icon" type="image/png" sizes="96x96" href="/songs/favicon-96.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #fffaf5; --fg: #1b1020; --fg-2: rgba(27, 16, 32, .9); --muted: rgba(27, 16, 32, .66);
  --line: rgba(27, 16, 32, .16); --chip: rgba(27, 16, 32, .05); --accent: #ec135b; --on-accent: #fffaf5;
  --warn: #b4235b; --ok: #1d7a4d; --field: #fff;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160c18; --fg: #fffaf5; --fg-2: rgba(255, 250, 245, .9); --muted: rgba(255, 250, 245, .66);
    --line: rgba(255, 250, 245, .18); --chip: rgba(255, 250, 245, .06); --accent: #ff3d7f; --on-accent: #160c18;
    --warn: #ff7aa8; --ok: #5fd39a; --field: #1f1422; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg-2); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
[hidden] { display: none !important; }
.btn { border: 1px solid var(--line); background: var(--chip); color: var(--fg); border-radius: 999px; padding: 8px 14px; font: 600 12px/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: default; }
input[type=password] { font: 400 16px/1.2 var(--sans); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--fg); width: 100%; }
/* the password screen */
.gate { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.gate form { width: 100%; max-width: 340px; display: grid; gap: 12px; }
h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 7vw, 40px); line-height: 1; color: var(--fg); }
h1 em { font-style: italic; font-weight: 400; color: var(--muted); }
.stat { font-size: 13px; color: var(--muted); min-height: 1.3em; }
.stat.bad { color: var(--warn); }
/* the admin page itself */
.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.bar .name { font-family: var(--serif); font-size: 20px; color: var(--fg); margin-right: auto; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--chip); }
.tabs button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font: 600 12.5px/1.2 var(--sans); color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
.panes { flex: 1; position: relative; min-height: 0; }
.panes iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
@media (max-width: 520px) { .bar .name { flex-basis: 100%; } .tabs { flex: 1; } .tabs button { flex: 1; padding: 7px 8px; } }
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="login" autocomplete="on">
    <h1>Admin <em>Song of the Day</em></h1>
    <input type="text" name="username" value="John" autocomplete="username" hidden>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
    <button class="btn primary" id="go" type="submit">Open</button>
    <span class="stat" id="msg" role="status" aria-live="polite"></span>
  </form>
</div>
<div class="app" id="app" hidden>
  <div class="bar">
    <span class="name">Song of the Day admin</span>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="facts" aria-selected="false">Facts</button>
      <button type="button" role="tab" data-tab="moods" aria-selected="false">Moods</button>
      <button type="button" role="tab" data-tab="members" aria-selected="false">Members</button>
    </div>
    <button class="btn" id="out" type="button">Sign out</button>
  </div>
  <div class="panes" id="panes"></div>
</div>
<script>
(function () {
  // Nothing of the admin side shows until the Worker accepts the password (the same ADMIN_KEY the facts and members
  // parts use). The parts (facts-admin.html, moods-admin.html, members-admin.html) only show inside this page, once
  // it has said the password is right (window.SOTD_ADMIN_OK); opened on their own they come back here.
  var WORKER = 'https://sotd-playlists.cooperking.workers.dev';
  var KEYS = 'sotd-admin-key';
  var PAGES = { facts: 'facts-admin.html', moods: 'moods-admin.html', members: 'members-admin.html' };
  var frames = {}, $ = function (id) { return document.getElementById(id); };
  function read() { try { return localStorage.getItem(KEYS) || ''; } catch (e) { return ''; } }
  function store(v) { try { if (v) localStorage.setItem(KEYS, v); else localStorage.removeItem(KEYS); } catch (e) {} }

  function check(pw) {   // an empty sign-off is the Worker's password check: it changes nothing
    return fetch(WORKER + '/facts/signoff', { method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + pw }, body: '{"items":[]}' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, error: j.error }; }); });
  }
  function tabNow() { var t = location.hash.slice(1); return PAGES[t] ? t : 'facts'; }
  function show(tab) {
    if (!frames[tab]) {
      var f = document.createElement('iframe');
      f.allow = 'web-share; clipboard-write *';   // the parts can use the phone's share sheet and copy
      f.title = tab; f.src = PAGES[tab] + '?v=' + Date.now(); frames[tab] = f; $('panes').appendChild(f);
    }
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== tab; });
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
    if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab);
  }
  function open() {
    window.SOTD_ADMIN_OK = true;
    $('gate').hidden = true; $('app').hidden = false;
    show(tabNow());
  }
  function lock(msg) {
    window.SOTD_ADMIN_OK = false;
    Object.keys(frames).forEach(function (k) { frames[k].remove(); delete frames[k]; });
    $('app').hidden = true; $('gate').hidden = false;
    $('msg').textContent = msg || ''; $('msg').className = 'stat' + (msg ? ' bad' : '');
    $('pw').value = ''; $('pw').focus();
  }

  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.tab); }); });
  window.addEventListener('hashchange', function () { if (window.SOTD_ADMIN_OK) show(tabNow()); });
  $('out').addEventListener('click', function () { store(''); lock('Signed out.'); $('msg').className = 'stat'; });
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    $('go').disabled = true; $('msg').className = 'stat'; $('msg').textContent = 'Checking…';
    check(pw).then(function (j) {
      if (j.status === 200) { store(pw); $('msg').textContent = ''; open(); }
      else lock(j.status === 401 ? 'Wrong password.' : (j.error || 'The Worker said ' + j.status + '.'));
    }).catch(function () { lock('Couldn\'t reach the Worker. Try again in a moment.'); })
      .then(function () { $('go').disabled = false; });
  });
  // a parts page whose password stops working (changed on the Worker) sends everyone back to the password screen
  window.SOTD_ADMIN_LOCK = function () { store(''); lock('The password has changed. Type the new one.'); };

  var saved = read();
  if (!saved) { lock(); return; }
  $('msg').textContent = 'Checking…';
  check(saved).then(function (j) {
    if (j.status === 200) open();
    else { if (j.status === 401) store(''); lock(j.status === 401 ? '' : (j.error || 'The Worker said ' + j.status + '.')); }
  }).catch(function () { lock('Couldn\'t reach the Worker. Try again in a moment.'); });
})();
</script>
</body>
</html>
