<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Song of the Day admin</title>
<link rel="icon" type="image/png" sizes="96x96" href="/songs/favicon-96.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<meta name="theme-color" content="#ec135b">
<script src="admin-theme.js"></script>
<link rel="stylesheet" href="admin.css">
<style>
html, body { height: 100%; }
body { overflow: hidden; }
/* the password screen: a white card on the month's colours */
.gate { position: fixed; inset: 0; z-index: 1; overflow: auto; display: grid; place-items: center; padding: 24px 16px; }
.gate .back { color: var(--fg); font-size: 13px; text-align: center; }
.gate form { width: 100%; max-width: 380px; padding: 22px 20px 20px; display: grid; gap: 12px; }
.gate h2 { font-size: 34px; }
.gate h2 em { font-style: italic; font-weight: 400; }
.gate input[type=password] { width: 100%; border: 1px solid var(--line); background: var(--field); color: var(--fg); border-radius: 12px; padding: 12px 14px; font: 16px var(--sans); }
.gate input:focus { outline: 1.5px solid var(--fg); outline-offset: 1px; }
.gate .btn { padding: 12px 18px; }
/* signed in: the bar along the top, as the calendar's, and the tab under it */
.app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; }   /* fixed: a phone's keyboard or a scroll can't push the bar off the top */
.bar { margin: max(10px, env(safe-area-inset-top, 0px)) 12px 0; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; border-radius: 999px; background: var(--glass-2); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.home { width: 38px; height: 38px; flex: none; margin-left: -12px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); display: grid; place-items: center; text-decoration: none; }
.home svg { width: 15px; height: 15px; }
.bar .name { font-family: var(--serif); font-weight: 500; font-size: 18px; color: var(--ink); margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .name em { font-style: italic; font-weight: 400; color: var(--ink-2); }
.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--glass); }
.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font: 600 11.5px/1.2 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--fg); }
.tabs .count { display: inline-grid; place-items: center; min-width: 17px; height: 17px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: #fff; color: var(--warn, #c2185b); font: 700 10.5px/1 var(--sans); letter-spacing: 0; vertical-align: 1px; box-shadow: 0 0 0 2px var(--warn, #c2185b); }
.out { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.out svg { width: 16px; height: 16px; }
.panes { flex: 1; position: relative; min-height: 0; }
.panes iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
@media (max-width: 480px) { .bar .name em { display: none; } .tabs button { padding: 8px 11px; } .bar { padding-left: 14px; } }
.tabs button { white-space: nowrap; }
@media (max-width: 430px) { .bar .name { display: none; } .bar .tabs { margin-left: auto; } .tabs button { padding: 8px 9px; letter-spacing: .06em; } .tabs .count { margin-left: 4px; } }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="gate" id="gate">
  <form class="card" id="login" autocomplete="on">
    <div class="kicker">John’s Song of the Day</div>
    <h2>Admin</h2>
    <input type="text" name="username" value="John" autocomplete="username" hidden>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
    <button class="btn primary" id="go" type="submit">Open</button>
    <span class="stat" id="msg" role="status" aria-live="polite"></span>
    <a class="back" href="/songs/">Back to the calendar</a>
  </form>
</div>
<div class="app" id="app" hidden>
  <div class="bar">
    <a class="home" href="/songs/" aria-label="Back to the calendar" title="Back to the calendar"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></a>
    <span class="name">Admin <em>Song of the Day</em></span>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="songs" aria-selected="false">Songs</button>
      <button type="button" role="tab" data-tab="members" aria-selected="false">Members</button>
      <button type="button" role="tab" data-tab="status" aria-selected="false">Status<span class="count" id="stcount" hidden></span></button>
    </div>
    <button class="out" id="out" type="button" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2.5h-3v11h3M10 5l3 3-3 3M13 8H6"/></svg></button>
  </div>
  <div class="panes" id="panes"></div>
</div>
<script>
(function () {
  // Nothing of the admin side shows until the Worker accepts the password (the same ADMIN_KEY the facts and members
  // parts use). The parts (songs-admin.html, members-admin.html, status-admin.html) only show inside this page, once
  // it has said the password is right (window.SOTD_ADMIN_OK); opened on their own they come back here.
  var WORKER = 'https://sotd-playlists.cooperking.workers.dev';
  var KEYS = 'sotd-admin-key';
  var PAGES = { songs: 'songs-admin.html', members: 'members-admin.html', status: 'status-admin.html' };
  var frames = {}, $ = function (id) { return document.getElementById(id); };
  function read() { try { return localStorage.getItem(KEYS) || ''; } catch (e) { return ''; } }
  function store(v) { try { if (v) localStorage.setItem(KEYS, v); else localStorage.removeItem(KEYS); } catch (e) {} }

  function check(pw) {   // an empty sign-off is the Worker's password check: it changes nothing
    return fetch(WORKER + '/facts/signoff', { method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + pw }, body: '{"items":[]}' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, error: j.error }; }); });
  }
  function tabNow() { var t = location.hash.slice(1); return PAGES[t] ? t : 'songs'; }   // (#facts and #moods, from before, open Songs)
  function frame(tab) {
    if (!frames[tab]) {
      var f = document.createElement('iframe');
      f.allow = 'web-share; clipboard-write *';   // the parts can use the phone's share sheet and copy
      f.title = tab; f.src = PAGES[tab] + '?v=' + Date.now(); f.hidden = true; frames[tab] = f; $('panes').appendChild(f);
    }
  }
  function show(tab) {
    var was = frames[tab] && !frames[tab].hidden;
    frame(tab);
    if (tab === 'status' && !was) window.SOTD_STATUS_NOW();   // (opened: checked again now)
    Object.keys(frames).forEach(function (k) { frames[k].hidden = k !== tab; });
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === tab)); });
    if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab);
  }
  function open() {
    window.SOTD_ADMIN_OK = true;
    try { if (document.activeElement) document.activeElement.blur(); window.scrollTo(0, 0); } catch (e) {}
    $('gate').hidden = true; $('app').hidden = false;
    show(tabNow());
    frame('status');   // (opened at once, out of sight: it puts the count of what has failed on its tab)
  }
  // the Status tab checked again now (on opening it, and after a sign-off on the Songs tab)
  window.SOTD_STATUS_NOW = function () { try { var w = frames.status && frames.status.contentWindow; if (w && w.SOTD_REFRESH) w.SOTD_REFRESH(); } catch (e) {} };
  // the Status tab's count: things that have failed or are stuck
  window.SOTD_STATUS = function (n) {
    $('stcount').hidden = !n; $('stcount').textContent = n || '';
    $('stcount').title = n ? n + (n === 1 ? ' thing has' : ' things have') + ' failed or is stuck' : '';
  };
  function lock(msg) {
    window.SOTD_ADMIN_OK = false; window.SOTD_STATUS(0);
    Object.keys(frames).forEach(function (k) { frames[k].remove(); delete frames[k]; });
    $('app').hidden = true; $('gate').hidden = false;
    $('msg').textContent = msg || ''; $('msg').className = 'stat' + (msg ? ' bad' : '');
    $('pw').value = ''; window.scrollTo(0, 0); $('pw').focus({ preventScroll: true });
  }

  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.tab); }); });
  window.addEventListener('hashchange', function () { if (window.SOTD_ADMIN_OK) show(tabNow()); });
  $('out').addEventListener('click', function () { store(''); lock('Signed out.'); $('msg').className = 'stat'; });
  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    $('go').disabled = true; $('msg').className = 'stat'; $('msg').textContent = 'Checking…';
    check(pw).then(function (j) {
      if (j.status === 200) { store(pw); $('msg').textContent = ''; open(); }
      else lock(j.status === 401 ? 'Wrong password.' : (j.error || 'The Worker said ' + j.status + '.'));
    }).catch(function () { lock('Couldn\'t reach the Worker. Try again in a moment.'); })
      .then(function () { $('go').disabled = false; });
  });
  // a parts page whose password stops working (changed on the Worker) sends everyone back to the password screen
  window.SOTD_ADMIN_LOCK = function () { store(''); lock('The password has changed. Type the new one.'); };

  var saved = read();
  if (!saved) { lock(); return; }
  $('msg').textContent = 'Checking…';
  check(saved).then(function (j) {
    if (j.status === 200) open();
    else { if (j.status === 401) store(''); lock(j.status === 401 ? '' : (j.error || 'The Worker said ' + j.status + '.')); }
  }).catch(function () { lock('Couldn\'t reach the Worker. Try again in a moment.'); });
})();
</script>
</body>
</html>
