<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D relation explorer</title>
<style>
:root{
  --page:#070912; --card:#171a28; --line:#ffffff22; --line-strong:#ffffff45;
  --t1:#eef0f6; --t2:#aeb3c4; --t3:#767c90;
}
*{box-sizing:border-box;}
body{
  margin:0; overflow:hidden; background:var(--page); color:var(--t1);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size:16px; line-height:1.5;
}
.wrap{position:fixed; top:12px; left:12px; z-index:10; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; max-width:640px;}
h1{font-size:16px; font-weight:500; margin:0 0 8px;}
select, button{
  font:inherit; font-size:14px; color:var(--t1); background:var(--card);
  border:1px solid var(--line-strong); border-radius:8px; padding:6px 10px; max-width:200px;
}
button{cursor:pointer;}
.bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 8px;}
.trail{display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--t2);}
.trail .crumb{cursor:pointer; padding:2px 9px; border-radius:9px; border:1px solid var(--line);}
.trail .crumb.cur{color:var(--t1); font-weight:500;}
.legend{display:flex; gap:14px; font-size:12px; color:var(--t2); margin:0; flex-wrap:wrap;}
.legend .dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px;}
#stage{
  position:fixed; inset:0; z-index:0;
  overflow:hidden; touch-action:none; user-select:none;
  background:radial-gradient(ellipse at 50% 42%, #141834 0%, #0a0d1e 45%, #05060f 100%);
}
#stars{position:absolute; inset:-15%; pointer-events:none;}
.star{position:absolute; border-radius:50%; background:#fff;}
#edges{position:absolute; inset:0; width:100%; height:100%;}
#labellayer{position:absolute; inset:0; pointer-events:none;}
.rlabel{position:absolute; left:0; top:0; z-index:850; font-size:11px; font-weight:500; padding:1px 9px; border-radius:9px; white-space:nowrap;}
#nodes{position:absolute; inset:0; pointer-events:none;}
.node{position:absolute; left:0; top:0; cursor:pointer; text-align:center; transform-origin:center; pointer-events:auto;}
#editor, #typespanel, #groupspanel{left:auto; right:12px; width:300px; max-height:calc(100vh - 24px); overflow:auto;}
#editor h1, #typespanel h1, #groupspanel h1{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.field{display:block; font-size:12px; color:var(--t2); margin:0 0 8px;}
.field input, .field textarea, .field select{
  display:block; width:100%; margin-top:3px; font:inherit; font-size:13px; color:var(--t1);
  background:var(--page); border:1px solid var(--line-strong); border-radius:8px; padding:5px 8px; max-width:none;
}
.conn{display:flex; align-items:center; font-size:12px; gap:6px; padding:3px 0;}
.conn select{font-size:11px; padding:2px 4px; max-width:104px; flex-shrink:0;}
.conn button{padding:0 7px; font-size:12px; flex-shrink:0;}
.addrow{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
.addrow select{flex:1; min-width:78px; max-width:none; font-size:12px; padding:5px 6px;}
.addrow button{font-size:12px;}
.danger{color:#E24B4A; border-color:#E24B4A; font-size:12px;}
.sec{font-size:12px; color:var(--t2); margin:12px 0 4px; border-top:1px solid var(--line); padding-top:10px;}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <svg id="edges"></svg>
  <div id="labellayer"></div>
  <div id="nodes"></div>
</div>
<div id="zoomctl" style="position:fixed; right:12px; bottom:12px; z-index:10; display:flex; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:6px;">
  <button id="zoomout" type="button" title="Zoom out" style="width:32px; padding:6px 0;">&minus;</button>
  <button id="zoomin" type="button" title="Zoom in" style="width:32px; padding:6px 0;">+</button>
</div>
<div id="lightbox" style="display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.78); cursor:zoom-out; align-items:center; justify-content:center;">
  <img id="lightbox-img" alt="" style="max-width:90vw; max-height:90vh; border-radius:12px;">
</div>
<div class="wrap">
  <h1 style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
    <span id="title">3D relation explorer</span>
    <button id="panel-toggle" type="button" style="font-size:12px; padding:2px 9px;" title="Minimize">&minus;</button>
  </h1>
  <div id="panel-body">
  <div class="bar">
    <select id="jump" aria-label="Jump to node"></select>
    <button id="typesbtn" type="button">Types</button>
    <button id="groupsbtn" type="button">Groups</button>
    <button id="addnode" type="button">Add node</button>
    <button id="newgraph" type="button">New</button>
    <button id="load" type="button">Load</button>
    <button id="merge" type="button">Merge</button>
    <button id="example" type="button">Example</button>
    <button id="export" type="button">Export</button>
    <button id="exportview" type="button" style="display:none;">Export this view</button>
    <button id="reset" type="button">Reset layout</button>
    <input type="file" id="file" accept=".json,.zip,application/json,application/zip" style="display:none">
    <input type="file" id="mergefile" accept=".json,.zip,application/json,application/zip" style="display:none">
    <div class="trail" id="trail" style="display:none;"></div>
  </div>
  <div class="trail" id="graphtrail" style="display:none; margin:0 0 8px;"></div>
  <div class="legend" id="legend"></div>
  </div>
</div>
<div class="wrap" id="editor" style="display:none;">
  <h1><span>Edit node</span><button id="ed-close" type="button">Done</button></h1>
  <label class="field">Name<input id="ed-name"></label>
  <div style="margin:-4px 0 8px;">
    <button id="ed-set-start" type="button" style="font-size:12px;">Set as start</button>
    <span id="ed-start-status" style="font-size:12px; color:var(--t2); margin-left:6px;"></span>
  </div>
  <label class="field">Group<select id="ed-group"></select></label>
  <div id="newgroup" style="display:none; border:1px solid var(--line); border-radius:8px; padding:8px; margin:0 0 8px;">
    <label class="field">Group label<input id="ng-label" placeholder="e.g. Family"></label>
    <label class="field">Colour<select id="ng-color"></select></label>
    <button id="ng-create" type="button" style="font-size:12px;">Create group</button>
  </div>
  <label class="field">Description<textarea id="ed-desc" rows="4" placeholder="Supports **bold**, *italic*, `code`, [links](url), and - bullet lines"></textarea></label>
  <label class="field">URL<input id="ed-url" placeholder="https://"></label>
  <label class="field">Link text<input id="ed-linktext" placeholder="Defaults to Wikipedia or Link"></label>
  <label class="field">Image<input id="ed-img" placeholder="Paste an image address"></label>
  <div style="display:flex; gap:6px; align-items:center; margin:-2px 0 8px; flex-wrap:wrap;">
    <button id="ed-upload" type="button" style="font-size:12px;">Upload image</button>
    <span id="ed-imgstatus" style="display:none; font-size:12px; color:var(--t2);">Uploaded image in use<button id="ed-imgremove" type="button" style="font-size:11px; padding:0 7px; margin-left:6px;">remove</button></span>
  </div>
  <input type="file" id="ed-imgfile" accept="image/*" style="display:none">
  <div class="sec">Linked graph</div>
  <div id="ed-graph-none">
    <button id="ed-graph-attach" type="button" style="font-size:12px;">Attach graph&hellip;</button>
  </div>
  <div id="ed-graph-some" style="display:none;">
    <div id="ed-graph-status" style="font-size:12px; color:var(--t2); margin:0 0 6px;"></div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin:0 0 8px;">
      <button id="ed-graph-enter" type="button" style="font-size:12px;">Enter graph &rarr;</button>
      <button id="ed-graph-detach" type="button" style="font-size:12px; color:#E24B4A; border-color:#E24B4A;">Detach</button>
    </div>
  </div>
  <input type="file" id="ed-graph-file" accept=".json,.zip,application/json,application/zip" style="display:none">
  <div class="sec">Connections</div>
  <div id="ed-conns"></div>
  <div class="addrow">
    <select id="ed-type"></select>
    <select id="ed-dir">
      <option value="out">this &#8594; other</option>
      <option value="in">other &#8594; this</option>
    </select>
    <select id="ed-target"></select>
    <button id="ed-add" type="button">Add</button>
  </div>
  <div id="newtype" style="display:none; border:1px solid var(--line); border-radius:8px; padding:8px; margin:0 0 8px;">
    <label class="field" style="display:flex; gap:6px; align-items:center; margin-bottom:6px;"><input type="checkbox" id="nt-mutual" checked style="width:auto;"> mutual (no direction)</label>
    <label class="field">Label<input id="nt-from" placeholder="e.g. partner"></label>
    <label class="field" id="nt-to-wrap" style="display:none;">Reverse label<input id="nt-to" placeholder="e.g. child"></label>
    <label class="field" style="display:flex; gap:6px; align-items:center;"><input type="checkbox" id="nt-dashed" style="width:auto;"> dashed line</label>
    <button id="nt-create" type="button" style="font-size:12px;">Create type</button>
  </div>
  <div class="sec">Merge duplicate</div>
  <div class="addrow">
    <select id="ed-merge-target"></select>
    <button id="ed-merge-go" class="danger" type="button">Merge into this node</button>
  </div>
  <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
    <button id="ed-delete" class="danger" type="button">Delete node</button>
    <button id="ed-delete-connected" class="danger" type="button">Delete node + connected</button>
  </div>
</div>
<div class="wrap" id="typespanel" style="display:none;">
  <h1><span>Relation types</span><button id="tp-close" type="button">Done</button></h1>
  <div id="tp-list"></div>
</div>
<div class="wrap" id="groupspanel" style="display:none;">
  <h1><span>Groups</span><button id="gp-close" type="button">Done</button></h1>
  <div id="gp-list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const BUILD_TAG="2026-07-24r \u2014 Greek Myth (gods+Odyssey+Iliad) as default example, Zeus start";
console.log("Relation explorer build:", BUILD_TAG);

const PAL = {
  purple:["#EEEDFE","#534AB7","#26215C","#7F77DD"],
  teal:["#E1F5EE","#0F6E56","#04342C","#1D9E75"],
  coral:["#FAECE7","#993C1D","#4A1B0C","#D85A30"],
  gray:["#F1EFE8","#5F5E5A","#2C2C2A","#888780"],
  blue:["#E6F1FB","#185FA5","#042C53","#378ADD"],
  pink:["#FBEAF0","#993556","#4B1528","#D4537E"],

  green:["#EAF3DE","#3B6D11","#173404","#97C459"],
  red:["#FCEBEB","#A32D2D","#501313","#E24B4A"]
};
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
function md(s){
  let t=esc(s);
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:inherit;">$1</a>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  t=t.replace(/`([^`]+)`/g,'<code style="font-family:ui-monospace,monospace;font-size:11px;">$1</code>');
  const lines=t.split(/\n/);
  let out="", inList=false;
  lines.forEach(ln=>{
    if(/^- /.test(ln)){
      if(!inList){ out+='<ul style="margin:4px 0;padding-left:16px;text-align:left;">'; inList=true; }
      out+='<li>'+ln.slice(2)+'</li>';
    } else {
      if(inList){ out+='</ul>'; inList=false; }
      out+=ln+'<br>';
    }
  });
  if(inList) out+='</ul>';
  return out.replace(/(<br>)+$/,'');
}

,"url":"https://en.wikipedia.org/wiki/Semele"},"helios":{"name":"Helios","group":"titan","desc":"The sun Titan. His sacred cattle, eaten by starving crewmen against explicit warning, cost the whole crew their lives.","url":"https://en.wikipedia.org/wiki/Helios"},"odysseus":{"name":"Odysseus","group":"mort","desc":"King of Ithaca. Ten years fighting at Troy, ten more getting home — *the man of twists and turns*. Slower to speak than to think, which is the whole point.","url":"https://en.wikipedia.org/wiki/Odysseus"},"penelope":{"name":"Penelope","group":"mort","desc":"Odysseus's wife. Holds off 108 suitors for years by weaving a burial shroud all day and unpicking it every night.","url":"https://en.wikipedia.org/wiki/Penelope"},"telemachus":{"name":"Telemachus","group":"mort","desc":"Their son. Spends the poem's first act growing up — travels to Pylos and Sparta chasing news of a father he barely remembers.","url":"https://en.wikipedia.org/wiki/Telemachus"},"laertes":{"name":"Laertes","group":"mort","desc":"Odysseus's father. Living out his old age tending an orchard, half-grieving a son everyone else has given up on.","url":"https://en.wikipedia.org/wiki/Laertes"},"nestor":{"name":"Nestor","group":"mort","desc":"Aged king of Pylos, veteran of Troy. Long-winded but well-meaning — has no real news of Odysseus, but plenty of advice.","url":"https://en.wikipedia.org/wiki/Nestor_(mythology)"},"menelaus":{"name":"Menelaus","group":"mort","desc":"King of Sparta, Helen's husband. Also took ten years to sail home from Troy — tells Telemachus so over a lavish dinner.","url":"https://en.wikipedia.org/wiki/Menelaus"},"helen":{"name":"Helen","group":"mort","desc":"Whose face launched the whole Trojan War, now settled back into married life at Sparta as if nothing happened.","url":"https://en.wikipedia.org/wiki/Helen_of_Troy"},"eumaeus":{"name":"Eumaeus","group":"mort","desc":"Odysseus's loyal swineherd. Shelters his disguised, unrecognised master without knowing who he is — loyalty as its own reward.","url":"https://en.wikipedia.org/wiki/Eumaeus"},"antinous":{"name":"Antinous","group":"mort","desc":"The boldest and rudest of Penelope's suitors, busy eating Odysseus out of house and home. First to die when the bow comes out.","url":"https://en.wikipedia.org/wiki/Antinous_(suitor)"},"nausicaa":{"name":"Nausicaa","group":"mort","desc":"Phaeacian princess. Finds the shipwrecked, naked Odysseus on the beach and, with impressive composure, doesn't run.","url":"https://en.wikipedia.org/wiki/Nausicaa"},"alcinous":{"name":"Alcinous","group":"mort","desc":"Nausicaa's father, king of the Phaeacians. Hosts Odysseus, hears his whole story, and finally ships him home.","url":"https://en.wikipedia.org/wiki/Alcinous"},"tiresias":{"name":"Tiresias","group":"mort","desc":"Blind prophet, dead and consulted in the underworld anyway. Tells Odysseus exactly what's coming — he mostly ignores it.","url":"https://en.wikipedia.org/wiki/Tiresias"},"circe":{"name":"Circe","group":"mort","desc":"Enchantress on Aeaea. Turns Odysseus's crew into pigs, then — once he resists her — becomes an unexpectedly helpful host for a year.","url":"https://en.wikipedia.org/wiki/Circe"},"calypso":{"name":"Calypso","group":"mort","desc":"Nymph who keeps Odysseus on her island for **seven years**, offering immortality if he'll stay. He still wants to go home.","url":"https://en.wikipedia.org/wiki/Calypso_(mythology)"},"polyphemus":{"name":"Polyphemus","group":"monster","desc":"One-eyed son of Poseidon. Traps Odysseus's crew in his cave and eats several before a red-hot stake and a fake name (\"Nobody\") end the standoff.","url":"https://en.wikipedia.org/wiki/Polyphemus"},"scylla":{"name":"Scylla","group":"monster","desc":"Six-headed monster in a narrow strait. Odysseus sails close to her rather than risk Charybdis — she still takes six men.","url":"https://en.wikipedia.org/wiki/Scylla"},"charybdis":{"name":"Charybdis","group":"monster","desc":"A whirlpool opposite Scylla. Swallows the function enterSubgraph(nodeId){
  const nd=N[nodeId];
  if(!nd || !nd.subgraph) return;
  graphStack.push({data:DATA, focusId:nodeId, title:DATA.title||"Untitled graph"});
  closeEditor();
  typesPanel.style.display="none";
  groupsPanel.style.display="none";
  loadData(nd.subgraph);
  renderGraphTrail();
}
function exitToLevel(i){
  const entry=graphStack[i];
  if(!entry) return;
  graphStack=graphStack.slice(0,i);
  closeEditor();
  typesPanel.style.display="none";
  groupsPanel.style.display="none";
  loadData(entry.data);
  if(entry.focusId && N[entry.focusId]) setFocus(entry.focusId);
  renderGraphTrail();
}
function renderGraphTrail(){
  const gt=document.getElementById("graphtrail");
  const expBtn=document.getElementById("export");
  const expViewBtn=document.getElementById("exportview");
  if(!graphStack.length){
    gt.style.display="none"; gt.innerHTML="";
    expBtn.title="Export the full graph as JSON (or a zip if it has uploaded images)";
    expViewBtn.style.display="none";
    return;
  }
  expBtn.title="Exports the whole top-level graph, including every nested linked graph \u2014 not just this view";
  expViewBtn.style.display="";
  expViewBtn.title="Exports only "+(DATA.title||"this graph")+" on its own, without the graph(s) above it";
  gt.style.display="";
  gt.innerHTML="";
  graphStack.forEach((entry,i)=>{
    const b=document.createElement("span");
    b.className="crumb";
    b.textContent=entry.title;
    b.title="Back to this graph";
    b.onclick=()=>exitToLevel(i);
    gt.appendChild(b);
    const s=document.createElement("span");
    s.textContent="\u2192"; s.style.color="var(--t3)";
    gt.appendChild(s);
  });
  const cur=document.createElement("span");
  cur.className="crumb cur";
  cur.textContent=DATA.title||"Untitled graph";
  gt.appendChild(cur);
}

function viewRadii(){
  const CX=stage.clientWidth/2, CY=stage.clientHeight/2;
  let halfW=60, halfH=32;
  Object.keys(neighbors).forEach(n=>{
    const sz=nodeSize[n];
    if(sz){ halfW=Math.max(halfW, sz.w/2); halfH=Math.max(halfH, sz.h/2); }
  });
  const desiredX=Math.max(220, CX-(halfW*1.1+6)), desiredY=Math.max(160, CY-(halfH*1.1+6));
  const s0=F*zoomLevel/DIST; // perspective scale at the focus's own depth, for the CURRENT zoom
  return { CX, CY, RxV:desiredX/s0, RyV:desiredY/s0 };
}

function typeOf(e){ return TYPES[e.type] || {label:e.type, mutual:true}; }
function colOf(id){ const g=GROUPS[(N[id]||{}).group]||{}; return PAL[g.color]||PAL.gray; }
function palName(id){ const g=GROUPS[(N[id]||{}).group]||{}; return PAL[g.color]?g.color:"gray"; }
function relTo(e){
  const t=typeOf(e);
  if(t.mutual) return t.label || e.type;
  return e.to===focusId ? (t.fromLabel||t.label||e.type) : (t.toLabel||t.label||e.type);
}
function typeName(k){
  const t=TYPES[k]||{};
  return t.mutual ? (t.label||k) : ((t.fromLabel||k)+" \u2192 "+(t.toLabel||k));
}

function deriveE(){
  const fallbackType=Object.keys(TYPES)[0];
  const list=(Array.isArray(DATA.links)?DATA.links:[])
    .filter(l=>l && N[l.from] && N[l.to])
    .map(l=>({from:l.from, to:l.to, type:TYPES[l.type]?l.type:fallbackType, off:0, src:l}));
  pairCount={};
  const pairSeen={};
  list.forEach(e=>{ const k=[e.from,e.to].sort().join("|"); pairCount[k]=(pairCount[k]||0)+1; });
  list.forEach(e=>{
    const k=[e.from,e.to].sort().join("|");
    if(pairCount[k]>1){ const i=pairSeen[k]||0; e.off = i===0 ? -9 : 9; pairSeen[k]=i+1; }
  });
  return list;
}

function rebuildGraph(){
  ids=Object.keys(N);
  E=deriveE();

  const fp=focusId && P3[focusId] ? P3[focusId] : {x:0,y:0,z:0};
  ids.forEach(id=>{
    if(!P3[id]) P3[id]={x:fp.x+rnd()*160, y:fp.y+rnd()*120, z:fp.z+rnd()*160};
    if(!P0[id]) P0[id]={x:P3[id].x, y:P3[id].y, z:P3[id].z};
  });
  Object.keys(P3).forEach(id=>{ if(!N[id]){ delete P3[id]; delete P0[id]; delete pinnedOffset[id]; } });

  nodesEl.innerHTML="";
  nodeEls={};
  ids.forEach(id=>{
    const el=document.createElement("div");
    el.className="node";
    nodesEl.appendChild(el);
    nodeEls[id]=el;
    el.addEventListener("click",()=>{ if(dragDist<6) focus(id); });
    el.addEventListener("dblclick",()=>{ openEditor(id); });
    el.addEventListener("pointerdown",e=>{
      e.stopPropagation();
      nodeDrag=id; auto=false; dragDist=0; lastX=e.clientX; lastY=e.clientY;
    });
  });

  edgeEls.forEach(l=>l.remove());
  hitEls.forEach(h=>h.remove());
  edgeEls=[]; hitEls=[];
  E.forEach(()=>{
    const l=document.createElementNS(SVGNS,"line");
    edgesEl.insertBefore(l, defsEl);
    edgeEls.push(l);
  });
  E.forEach(e=>{
    const h=document.createElementNS(SVGNS,"line");
    h.setAttribute("stroke","rgba(0,0,0,0)");
    h.setAttribute("stroke-width","16");
    h.style.pointerEvents="stroke";
    h.style.cursor="pointer";
    h.addEventListener("click",ev=>{
      if(dragDist>=6) return;
      const rect=stage.getBoundingClientRect();
      const px=ev.clientX-rect.left, py=ev.clientY-rect.top;
      const cand=[e.from,e.to].filter(n=>n!==focusId);
      let target=cand[0];
      if(cand.length===2){
        const pa=proj[e.from], pb=proj[e.to];
        if(pa&&pb){
          const da=(px-pa.x)*(px-pa.x)+(py-pa.y)*(py-pa.y);
          const db=(px-pb.x)*(px-pb.x)+(py-pb.y)*(py-pb.y);
          target = da<=db ? e.from : e.to;
        }
      }
      if(target) focus(target);
    });
    edgesEl.appendChild(h);
    hitEls.push(h);
  });

  rebuildJump();
  buildLegend();

  trail=trail.filter(t=>N[t]&&isVisible(t));
  if(!focusId || !N[focusId] || !isVisible(focusId)) focusId=ids.find(isVisible)||ids[0];
  setFocus(focusId);
  renderTrail();
  scheduleSave();
}

function loadData(data){
  if(!data || typeof data.nodes!=="object" || !Object.keys(data.nodes).length)
    throw new Error('needs a non-empty "nodes" object');
  DATA=data;
  N=data.nodes;
  if(!data.groups) data.groups={};
  GROUPS=data.groups;
  if(!data.types || !Object.keys(data.types).length) data.types={link:{label:"link", mutual:true}};
  TYPES=data.types;
  if(!Array.isArray(data.links)) data.links=[];
  ids=Object.keys(N);
  E=deriveE();

  const inc={};
  E.forEach(e=>{ if(!typeOf(e).mutual){ (inc[e.to]=inc[e.to]||[]).push(e.from); } });
  const memo={}, mark={};
  const dep=id=>{
    if(memo[id]!==undefined) return memo[id];
    if(mark[id]) return 0;
    mark[id]=1;
    const ps=inc[id]||[];
    memo[id] = ps.length ? 1+Math.max(...ps.map(dep)) : 0;
    mark[id]=0;
    return memo[id];
  };
  ids.forEach(dep);
  const maxD=ids.reduce((m,id)=>Math.max(m,memo[id]),0);

  seedv=42;
  P3={};
  ids.forEach(id=>{ P3[id]={x:rnd()*440, y:memo[id]*115 - maxD*115/2, z:rnd()*440}; });
  for(let it=0; it<220; it++){
    for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
      const a=P3[ids[i]], b=P3[ids[j]];
      const dx=a.x-b.x, dz=a.z-b.z, dy=(a.y-b.y)*0.5;
      const d2=dx*dx+dz*dz+dy*dy+0.01, d=Math.sqrt(d2);
      const f=Math.min(2600/d2, 6)/d;
      a.x+=dx*f; a.z+=dz*f; b.x-=dx*f; b.z-=dz*f;
    }
    E.forEach(e=>{
      const a=P3[e.from], b=P3[e.to];
      const dx=b.x-a.x, dz=b.z-a.z;
      a.x+=dx*0.012; a.z+=dz*0.012; b.x-=dx*0.012; b.z-=dz*0.012;
    });
    let mx=0,mz=0; ids.forEach(id=>{mx+=P3[id].x; mz+=P3[id].z;});
    mx/=ids.length; mz/=ids.length;
    ids.forEach(id=>{P3[id].x-=mx; P3[id].z-=mz;});
  }
  P0=JSON.parse(JSON.stringify(P3));

  document.getElementById("title").textContent=data.title||"Relation explorer";
  document.title=data.title||"Relation explorer";
  trail=[]; pinnedOffset={}; nodeDrag=null; lastPinnedFocus=null;
  hiddenGroups={};
  focusId=(data.start && N[data.start]) ? data.start : ids[0];
  cam.x=0; cam.y=0; cam.z=-900; th=0.6; auto=true; zoomLevel=1;
  closeEditor();
  typesPanel.style.display="none";
  groupsPanel.style.display="none";
  rebuildGraph();
}

function buildLegend(){
  const lg=document.getElementById("legend");
  lg.innerHTML="";
  const entries=Object.keys(GROUPS).map(k=>({k, label:GROUPS[k].label||k, color:(PAL[GROUPS[k].color]||PAL.gray)[3]}));
  if(ids.some(id=>groupKeyOf(id)==="") && Object.keys(GROUPS).length)
    entries.push({k:"", label:"Ungrouped", color:PAL.gray[3]});
  entries.forEach(en=>{
    const s=document.createElement("span");
    s.style.cursor="pointer";
    s.title="Show / hide this group";
    if(hiddenGroups[en.k]){ s.style.opacity="0.4"; s.style.textDecoration="line-through"; }
    s.innerHTML='<span class="dot" style="background:'+en.color+'"></span>'+esc(en.label);
    s.onclick=()=>toggleGroup(en.k);
    lg.appendChild(s);
  });
  const hint=document.createElement("span");
  hint.style.color="var(--t3)";
  hint.textContent="Drag a card to move it \u00b7 drag the background to rotate \u00b7 click a card or connection to focus \u00b7 double-click to edit \u00b7 click a group to show or hide it";
  lg.appendChild(hint);
}

function toggleGroup(k){

  if(!isVisible(focusId)) focusId=ids.find(isVisible);

}

function rebuildJump(){
  jump.innerHTML="";
  ids.filter(isVisible).sort((a,b)=>String(N[a].name||a).localeCompare(String(N[b].name||b))).forEach(id=>{
    const o=document.createElement("option"); o.value=id; o.textContent=N[id].name||id; jump.appendChild(o);
  });
  if(focusId && isVisible(focusId)) jump.value=focusId;
}

function setFocus(id){
  focusId=id; jump.value=id;
  neighbors={}; focusEdges=[];
  E.forEach((e,i)=>{
    if(e.from===id||e.to===id){
      const other=e.from===id?e.to:e.from;
      if(!isVisible(other)) return;
      neighbors[other]=1;
      focusEdges.push({e,i});
    }
  });

  if(lastPinnedFocus!==id){ pinnedOffset={}; lastPinnedFocus=id; }
  neighborLayout={};
  const zone={}, pri={top:3,side:2,bottom:1};
  focusEdges.forEach(fe=>{
    const e=fe.e, t=typeOf(e);
    const n=e.from===id?e.to:e.from;
    const z = t.mutual ? "side" : (e.to===id ? "top" : "bottom");
    if(!zone[n]||pri[z]>pri[zone[n]]) zone[n]=z;
  });
  const top=[], side=[], bot=[];
  Object.keys(neighbors).forEach(n=>{ (zone[n]==="top"?top:zone[n]==="side"?side:bot).push(n); });
  const {RxV:RxV0, RyV:RyV0}=viewRadii();
  const focusClearPx=280; // half-diagonal clearance so a ring never lands behind the (much larger) focus card
  const rsMinFrac=Math.min(0.85, focusClearPx/Math.min(RxV0,RyV0));
  function arrangeZone(list, axis, sign){
    const n=list.length;
    if(!n) return;
    const perRow=4;
    const rows=Math.max(1, Math.ceil(n/perRow));
    list.forEach((nid,i)=>{
      const row=Math.floor(i/perRow);
      const rowStart=row*perRow;
      const itemsInRow=Math.min(perRow, n-rowStart);
      const colInRow=i-rowStart;
      const primaryFrac = rows===1 ? 1 : rsMinFrac+(row/(rows-1))*(1-rsMinFrac);
      const secCap = axis==="y" ? 2 : 0.8;
      const secStep = axis==="y" ? 0.55 : 0.34;
      const secSpread = itemsInRow<=1 ? 0 : Math.min(secCap, secStep*(itemsInRow-1));
      const secFrac = itemsInRow<=1 ? 0 : -secSpread/2+secSpread*colInRow/(itemsInRow-1);
      const dz=row*25;
      let fx, fy;
      if(axis==="y"){ fy=sign*primaryFrac; fx=secFrac; }
      else { fx=sign*primaryFrac; fy=secFrac; }
      neighborLayout[nid]={fx:fx, fy:fy, dz:dz};
    });
  }
  arrangeZone(top, "y", -1);
  arrangeZone(bot, "y", 1);
  const leftSide=[], rightSide=[];
  side.forEach((n,i)=>{ (i%2?rightSide:leftSide).push(n); });
  arrangeZone(leftSide, "x", -1);
  arrangeZone(rightSide, "x", 1);

  ids.forEach(nid=>{
    const nd=N[nid], c=colOf(nid), el=nodeEls[nid];
    const nm=esc(nd.name||nid);
    const avatar=(size,ring,zoom)=> nd.img
      ? '<img src="'+esc(nd.img)+'"'+(zoom?' class="portrait"':'')+' alt="" style="width:'+size+'px;height:'+size+'px;border-radius:50%;object-fit:cover;border:'+ring+'px solid '+c[3]+';display:block;margin:0 auto '+(size>30?7:4)+'px;'+(zoom?'cursor:zoom-in;':'')+'">'
      : '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+c[3]+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:'+(size>30?15:11)+'px;margin:0 auto '+(size>30?7:4)+'px;">'+nm.charAt(0)+'</div>';
    const portalMark = nd.subgraph ? '<span style="opacity:0.7;">\u25c8</span> ' : '';
    if(nid===id){
      el.style.cursor="grab";
      el.style.filter="";
      let inner='<div style="background:'+c[0]+'; border:2px solid '+c[3]+'; border-radius:12px; padding:12px 16px; width:180px;">'
        +avatar(nd.img?64:40,2,true)
        +'<div style="font-size:16px;font-weight:500;color:'+c[2]+';">'+portalMark+nm+'</div>';
      const gl=(GROUPS[nd.group]||{}).label;
      if(gl) inner+='<div style="font-size:11px;color:'+c[1]+';margin:1px 0 5px;">'+esc(gl)+'</div>';
      if(nd.desc) inner+='<div style="font-size:12px;color:'+c[1]+';line-height:1.4;">'+md(nd.desc)+'</div>';
      if(nd.url){
        const linktxt = nd.linkText || (/wikipedia/i.test(nd.url)?'Wikipedia':'Link');
        inner+='<a href="'+esc(nd.url)+'" target="_blank" rel="noopener" style="display:inline-block;margin-top:7px;font-size:12px;color:'+c[1]+';">'+esc(linktxt)+' &#8599;</a>';
      }
      if(nd.subgraph){
        const n2=Object.keys(nd.subgraph.nodes||{}).length;
        inner+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid '+c[3]+';">'
          +'<span class="entergraph" data-id="'+nid+'" style="cursor:pointer;font-size:12px;color:'+c[1]+';text-decoration:underline;">Enter graph ('+n2+' node'+(n2===1?'':'s')+') &#8594;</span></div>';
      }
      el.innerHTML=inner+'</div>';
    } else if(neighbors[nid]){
      el.style.cursor="pointer";
      el.style.filter="";
      el.innerHTML='<div style="background:'+c[0]+'; border:1px solid '+c[3]+'; border-radius:10px; padding:6px 10px; min-width:84px;">'
        +avatar(nd.img?28:22,1,false)
        +'<div style="font-size:12px;font-weight:500;color:'+c[2]+'; white-space:nowrap;">'+portalMark+nm+'</div></div>';
    } else {
      el.style.cursor="pointer";
      el.style.filter="";
      el.innerHTML='<div style="padding:4px 6px;">'
        +(nd.img
          ? '<img src="'+esc(nd.img)+'" alt="" style="width:16px;height:16px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 3px;">'
          : '<div style="width:14px;height:14px;border-radius:50%;background:'+c[3]+';margin:0 auto 3px;"></div>')
        +'<div style="font-size:11px; color:var(--t2); white-space:nowrap;">'+portalMark+nm+'</div></div>';
    }
  });

  ids.forEach(nid=>{
    const el=nodeEls[nid];
    nodeSize[nid]={w:el.offsetWidth||24, h:el.offsetHeight||24};
  });

  labelLayer.innerHTML="";
  const fc=colOf(id);
  const fracSeen={};
  labels=focusEdges.map((fe,idx)=>{
    const d=document.createElement("div");
    d.className="rlabel";
    d.style.background=fc[0];
    d.style.border="1px solid "+fc[3];
    d.style.color=fc[2];
    d.textContent=relTo(fe.e);
    labelLayer.appendChild(d);
    const k=[fe.e.from,fe.e.to].sort().join("|");
    let frac;
    if(pairCount[k]>1){ const seen=fracSeen[k]||0; frac = seen===0 ? 0.42 : 0.62; fracSeen[k]=seen+1; }
    else { const slots=[0.42,0.56,0.68,0.48,0.60]; frac = slots[idx%slots.length]; }
    return {el:d,fe,frac:frac,off:fe.e.off||0};
  });

  if(editingId && editingId!==id && document.getElementById("editor").style.display!=="none"){
    openEditor(id);
  }
}

}

function slugKey(base, obj){
  let s=String(base||"x").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"x";
  let k=s, i=2;
  while(obj[k]) k=s+"-"+(i++);
  return k;
}

    else span.textContent=(t.fromLabel||l.type)+": "+(N[other].name||other);
    row.appendChild(span);

      const rev=document.createElement("button");
      rev.type="button"; rev.textContent="\u21c4"; rev.title="Reverse direction";
      rev.onclick=()=>{ const f=l.from; l.from=l.to; l.to=f; rebuildGraph(); renderConns(); };

    }

    p.textContent="No connections yet";
    edConns.appendChild(p);
  }
}

function fillGaps(dst, src, groupMap){
  if(!dst.desc && src.desc) dst.desc=src.desc;
  if(!dst.url && src.url) dst.url=src.url;
  if(!dst.img && src.img) dst.img=src.img;
  if(!dst.group && src.group) dst.group = groupMap ? (groupMap[src.group]||src.group) : src.group;
  if(!dst.subgraph && src.subgraph) dst.subgraph=src.subgraph;
}
function dedupeLinks(){
  const seen=new Set();
  DATA.links=DATA.links.filter(l=>{
    if(l.from===l.to) return false;
    const key=l.from+"|"+l.to+"|"+l.type;
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function mergeNodeInto(loserId, keeperId){
  if(loserId===keeperId) return;
  const loser=N[loserId], keeper=N[keeperId];
  if(!loser||!keeper) return;
  fillGaps(keeper, loser);
  DATA.links.forEach(l=>{
    if(l.from===loserId) l.from=keeperId;
    if(l.to===loserId) l.to=keeperId;
  });
  dedupeLinks();
  delete N[loserId];
  trail=trail.filter(t=>t!==loserId);
  if(DATA.start===loserId) DATA.start=keeperId;
}

  if(!confirm('Merge "'+loserName+'" into "'+keeperName+'"? "'+loserName+'" will be deleted \u2014 its connections move onto "'+keeperName+'", and any details "'+keeperName+'" is missing get filled in from it. This cannot be undone.')) return;

};

function connectedComponent(startId){
  const seen=new Set([startId]);
  const queue=[startId];
  while(queue.length){
    const cur=queue.pop();
    DATA.links.forEach(l=>{
      if(l.from===cur && !seen.has(l.to)){ seen.add(l.to); queue.push(l.to); }
      if(l.to===cur && !seen.has(l.from)){ seen.add(l.from); queue.push(l.from); }
    });
  }
  return seen;
}

window.addEventListener("pointermove",e=>{

  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  dragDist+=Math.abs(dx)+Math.abs(dy);

    const ct=Math.cos(th), st=Math.sin(th);
    const p=P3[nodeDrag];
    if(!p) return;
    let rx=p.x*ct - p.z*st;
    const rz=p.x*st + p.z*ct;
    const s=F/Math.max(80, rz-cam.z);
    rx += dx/s; p.y += dy/s;
    if(nodeDrag!==focusId && P3[focusId]){
      const {RxV, RyV}=viewRadii();
      const fp=P3[focusId];
      const ffx=fp.x*ct - fp.z*st, ffz=fp.x*st + fp.z*ct;
      rx = Math.max(ffx-RxV, Math.min(ffx+RxV, rx));
      p.y = Math.max(fp.y-RyV, Math.min(fp.y+RyV, p.y));
      p.x = rx*ct + rz*st;
      p.z = -rx*st + rz*ct;
      pinnedOffset[nodeDrag] = { vx: rx-ffx, vy: p.y-fp.y, vz: rz-ffz };
    } else {
      rx = Math.max(cam.x-900, Math.min(cam.x+900, rx));
      p.y = Math.max(cam.y-650, Math.min(cam.y+650, p.y));
      p.x = rx*ct + rz*st;
      p.z = -rx*st + rz*ct;
    }
  } else {

  }

async function rehydrateImages(dataset, zip, pathPrefix){
  const nodes=dataset.nodes||{};
  for(const id of Object.keys(nodes)){
    const nd=nodes[id];
    const img=nd.img;
    if(img && img.indexOf(pathPrefix+"images/")===0){
      const zf=zip.file(img);
      if(zf){
        const ext=img.split(".").pop().toLowerCase();
        const mime="image/"+(ext==="jpg"?"jpeg":ext);
        nd.img="data:"+mime+";base64,"+(await zf.async("base64"));
      }
    }
    if(nd.subgraph) await rehydrateImages(nd.subgraph, zip, pathPrefix+"subgraphs/"+id+"/");
  }
}
async function parseJsonOrZip(file){
  if(/\.zip$/i.test(file.name)){
    if(typeof JSZip==="undefined") throw new Error("reading .zip bundles needs the JSZip library (internet required)");
    const zip=await JSZip.loadAsync(file);
    const df=zip.file("data.json");
    if(!df) throw new Error("no data.json inside the zip");
    const data=JSON.parse(await df.async("string"));
    await rehydrateImages(data, zip, "");
    return data;
  }
  return JSON.parse(await file.text());
}

function findMergeMatch(nd2){
  const url2=(nd2.url||"").trim();
  if(url2){
    for(const eid of Object.keys(N)){
      if((N[eid].url||"").trim()===url2) return eid;
    }
  }
  const nm2=(nd2.name||"").trim().toLowerCase();
  if(nm2){
    for(const eid of Object.keys(N)){
      if((N[eid].name||"").trim().toLowerCase()===nm2) return eid;
    }
  }
  return null;
}
function mergeInto(data2){
  if(!data2||typeof data2.nodes!=="object"||!Object.keys(data2.nodes).length){
    alert("That file has no nodes to merge.");
    return;
  }
  const groupMap={};
  Object.keys(data2.groups||{}).forEach(k=>{
    const g2=data2.groups[k];
    if(GROUPS[k] && JSON.stringify(GROUPS[k])===JSON.stringify(g2)){ groupMap[k]=k; return; }
    const nk=slugKey(k, GROUPS);
    GROUPS[nk]=g2;
    groupMap[k]=nk;
  });
  const typeMap={};
  Object.keys(data2.types||{}).forEach(k=>{
    const t2=data2.types[k];
    if(TYPES[k] && JSON.stringify(TYPES[k])===JSON.stringify(t2)){ typeMap[k]=k; return; }
    const nk=slugKey(k, TYPES);
    TYPES[nk]=t2;
    typeMap[k]=nk;
  });
  const idMap={};
  let mergedCount=0, addedCount=0;
  const fp = focusId && P3[focusId] ? P3[focusId] : {x:0,y:0,z:0};
  Object.keys(data2.nodes).forEach(k=>{
    const nd2=data2.nodes[k];
    const matchId=findMergeMatch(nd2);
    if(matchId){
      fillGaps(N[matchId], nd2, groupMap);
      idMap[k]=matchId;
      mergedCount++;
      return;
    }
    const nk=slugKey(k, N);
    const nd=JSON.parse(JSON.stringify(nd2));
    if(nd.group) nd.group = groupMap[nd.group] || nd.group;
    N[nk]=nd;
    idMap[k]=nk;
    P3[nk]={x:fp.x+rnd()*260-130, y:fp.y+rnd()*180-90, z:fp.z+rnd()*260-130};
    P0[nk]={x:P3[nk].x, y:P3[nk].y, z:P3[nk].z};
    addedCount++;
  });
  (data2.links||[]).forEach(l=>{
    if(!idMap[l.from]||!idMap[l.to]) return;
    const ty = (l.type in typeMap) ? typeMap[l.type] : l.type;
    const from=idMap[l.from], to=idMap[l.to];
    if(from===to) return;
    if(DATA.links.some(x=>x.from===from&&x.to===to&&x.type===ty)) return;
    DATA.links.push({from,to,type:ty});
  });
  rebuildGraph();
  if(mergedCount) alert("Merged "+mergedCount+" matching node"+(mergedCount===1?"":"s")+" (same Wikipedia/URL or exact name) and added "+addedCount+" new node"+(addedCount===1?"":"s")+".");
}

function hasEmbeddedImage(ds){
  return Object.values(ds.nodes||{}).some(nd=>
    (nd.img && nd.img.slice(0,5)==="data:") || (nd.subgraph && hasEmbeddedImage(nd.subgraph))
  );
}
function collectAndExtractImages(ds, zip, pathPrefix){
  Object.keys(ds.nodes||{}).forEach(id=>{
    const nd=ds.nodes[id];
    const img=nd.img;
    if(img && img.slice(0,5)==="data:"){
      const m=img.match(/^data:image\/([a-z0-9.+-]+);base64,(.*)$/i);
      if(m){
        const ext=(m[1].toLowerCase()==="jpeg")?"jpg":m[1].toLowerCase().replace(/[^a-z0-9]/g,"");
        const fname=pathPrefix+"images/"+id+"."+ext;
        zip.file(fname, m[2], {base64:true});
        nd.img=fname;
      }
    }
    if(nd.subgraph) collectAndExtractImages(nd.subgraph, zip, pathPrefix+"subgraphs/"+id+"/");
  });
}
async function doExport(dataset){
  dragDist=0;
  const base=(dataset.title||"relations").replace(/[^a-z0-9]+/gi,"_").toLowerCase();
  const dl=(blob,name)=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=name;
    a.click();
    URL.revokeObjectURL(a.href);
  };
  if(!hasEmbeddedImage(dataset)){
    dl(new Blob([JSON.stringify(dataset,null,2)],{type:"application/json"}), base+".json");
    return;
  }
  if(typeof JSZip==="undefined"){
    alert("Bundling images as separate files needs the JSZip library, which loads from the internet. Exporting with embedded images instead.");
    dl(new Blob([JSON.stringify(dataset,null,2)],{type:"application/json"}), base+".json");
    return;
  }
  const zip=new JSZip();
  const copy=JSON.parse(JSON.stringify(dataset));
  collectAndExtractImages(copy, zip, "");
  zip.file("data.json", JSON.stringify(copy,null,2));
  const blob=await zip.generateAsync({type:"blob"});
  dl(blob, base+".zip");
}
document.getElementById("export").onclick=()=>{ if(DATA) doExport(currentRootData()); };
document.getElementById("exportview").onclick=()=>{ if(DATA) doExport(DATA); };

function frame(){
  if(!focusId||!P3[focusId]){ requestAnimationFrame(frame); return; }
  const {CX, CY, RxV, RyV}=viewRadii();
  if(auto) th+=0.0018;
  starsEl.style.transform="translateX("+(((-th*160)%(stage.clientWidth*0.3))).toFixed(1)+"px)";
  const ct=Math.cos(th), st=Math.sin(th);
  const fp=P3[focusId];
  const frx=fp.x*ct - fp.z*st, frz=fp.x*st + fp.z*ct;
  if(nodeDrag!==focusId){
    cam.x+=(frx-cam.x)*0.06; cam.y+=(fp.y-cam.y)*0.06; cam.z+=((frz-DIST/zoomLevel)-cam.z)*0.06;
  }

  Object.keys(pinnedOffset).forEach(nid=>{
    if(nodeDrag===nid || !P3[nid]) return;
    const off=pinnedOffset[nid];
    const vx=Math.max(-RxV, Math.min(RxV, off.vx)), vy=Math.max(-RyV, Math.min(RyV, off.vy));
    const tvx=frx+vx, tvy=fp.y+vy, tvz=frz+off.vz;
    const wx=tvx*ct+tvz*st, wz=-tvx*st+tvz*ct;
    P3[nid].x=wx; P3[nid].y=tvy; P3[nid].z=wz;
  });
  Object.keys(neighborLayout).forEach(nid=>{
    if(nodeDrag===nid || pinnedOffset[nid] || !P3[nid]) return;
    const L=neighborLayout[nid], p=P3[nid];
    const tvx=frx+L.fx*RxV, tvy=fp.y+L.fy*RyV, tvz=frz+L.dz;
    const wx=tvx*ct+tvz*st, wz=-tvx*st+tvz*ct;
    p.x+=(wx-p.x)*0.08; p.y+=(tvy-p.y)*0.08; p.z+=(wz-p.z)*0.08;
  });

  ids.forEach(id=>{
    const p=P3[id], el=nodeEls[id];
    if(!p||!el) return;
    if(!isVisible(id)){ el.style.display="none"; proj[id]=null; return; }
    el.style.display="";
    const rx=p.x*ct - p.z*st, rz=p.x*st + p.z*ct;
    const dz=Math.max(140, rz-cam.z);
    const s=F/dz;
    const sx=CX+(rx-cam.x)*s, sy=CY+(p.y-cam.y)*s;
    const vs=Math.max(0.35, Math.min(1.2, s));
    const isF=id===focusId, isN=!!neighbors[id];
    proj[id]={x:sx,y:sy,s:s,vs:isF?1:vs};
    const op=isF?1 : isN?Math.max(0.8,Math.min(1,s)) : Math.max(0.15,Math.min(0.75,(s-0.35)*0.9));
    el.style.transform="translate("+sx+"px,"+sy+"px) translate(-50%,-50%) scale("+(isF?1:vs)+")";
    el.style.opacity=op;
    if(isF||isN){ el.style.filter=""; }
    else {
      const blur=Math.min(3.2, Math.max(0,(1.02-s)*3.4));
      el.style.filter="saturate(0.4) blur("+blur.toFixed(2)+"px)";
    }
    el.style.zIndex=isF?900:Math.round(800-dz*0.5);
  });

  function projectApprox(nid){
    const p=P3[nid];
    const rx=p.x*ct-p.z*st, rz=p.x*st+p.z*ct;
    const depth=Math.max(140, rz-cam.z);
    const s=F/depth;
    return {x:CX+(rx-cam.x)*s, y:CY+(p.y-cam.y)*s, s};
  }
  const collideIds=Object.keys(neighbors).filter(nid=>proj[nid] && nid!==focusId && nodeDrag!==nid && !pinnedOffset[nid]);
  for(let pass=0; pass<3; pass++){
    for(let i=0;i<collideIds.length;i++){
      for(let j=i+1;j<collideIds.length;j++){
        const a=collideIds[i], b=collideIds[j];
        if(!P3[a]||!P3[b]) continue;
        const pa=projectApprox(a), pb=projectApprox(b);
        const vsa=Math.max(0.35,Math.min(1.2,pa.s)), vsb=Math.max(0.35,Math.min(1.2,pb.s));
        const szA=nodeSize[a]||{w:84,h:60}, szB=nodeSize[b]||{w:84,h:60};
        const wa=szA.w*vsa, ha=szA.h*vsa, wb=szB.w*vsb, hb=szB.h*vsb;
        const dx=pb.x-pa.x, dy=pb.y-pa.y;
        const pad=14;
        const overlapX=(wa+wb)/2+pad-Math.abs(dx);
        const overlapY=(ha+hb)/2+pad-Math.abs(dy);
        if(overlapX>0 && overlapY>0){
          const dirX=dx>=0?1:-1, dirY=dy>=0?1:-1;
          let moveXA=0, moveYA=0, moveXB=0, moveYB=0;
          if(overlapX<overlapY){ moveXA=-dirX*overlapX/2; moveXB=dirX*overlapX/2; }
          else { moveYA=-dirY*overlapY/2; moveYB=dirY*overlapY/2; }
          const sa=Math.max(0.3,pa.s), sb=Math.max(0.3,pb.s), factor=0.5;
          const rxA=moveXA/sa*factor, ryA=moveYA/sa*factor;
          const rxB=moveXB/sb*factor, ryB=moveYB/sb*factor;
          P3[a].x += rxA*ct; P3[a].z += -rxA*st; P3[a].y += ryA;
          P3[b].x += rxB*ct; P3[b].z += -rxB*st; P3[b].y += ryB;
        }
      }
    }
  }

  E.forEach((e,i)=>{
    const a=proj[e.from], b=proj[e.to], l=edgeEls[i], h=hitEls[i];
    if(!l||!h) return;
    if(!a||!b){ l.setAttribute("stroke-opacity","0"); l.setAttribute("marker-end",""); h.setAttribute("stroke-width","0"); return; }
    h.setAttribute("stroke-width","16");
    h.setAttribute("x1",a.x); h.setAttribute("y1",a.y);
    h.setAttribute("x2",b.x); h.setAttribute("y2",b.y);
    const t=typeOf(e);
    const hot = e.from===focusId||e.to===focusId;
    let x1=a.x, y1=a.y, x2=b.x, y2=b.y;
    if(e.off){
      const ca = e.from<e.to ? a : b, cb = e.from<e.to ? b : a;
      const cdx=cb.x-ca.x, cdy=cb.y-ca.y, cl=Math.sqrt(cdx*cdx+cdy*cdy)||1;
      const ox=-cdy/cl*e.off, oy=cdx/cl*e.off;
      x1+=ox; y1+=oy; x2+=ox; y2+=oy;
    }
    const dir = !t.mutual && t.arrow!==false;
    const hotColorId = t.mutual ? focusId : e.from;
    if(dir){
      const sz=nodeSize[e.to]||{w:24,h:24};
      const vsTo=(b.vs!==undefined)?b.vs:1;
      const hw=sz.w/2*vsTo+5, hh=sz.h/2*vsTo+5;
      const dx=x2-x1, dy=y2-y1;
      const fx = dx!==0 ? 1-hw/Math.abs(dx) : -1e9;
      const fy = dy!==0 ? 1-hh/Math.abs(dy) : -1e9;
      let tt=Math.max(fx,fy);
      tt=Math.max(0,Math.min(1,tt));
      x2=x1+dx*tt; y2=y1+dy*tt;
    }
    l.setAttribute("x1",x1); l.setAttribute("y1",y1);
    l.setAttribute("x2",x2); l.setAttribute("y2",y2);
    l.setAttribute("stroke-dasharray", t.dashed ? "5 4" : "");
    l.setAttribute("marker-end", dir ? (hot ? "url(#arr-"+palName(hotColorId)+")" : "url(#arr-dim)") : "");
    l.setAttribute("stroke", hot?colOf(hotColorId)[3]:"var(--line-strong)");
    l.setAttribute("stroke-width", hot?1.8:0.8);
    l.setAttribute("stroke-opacity", hot?0.9:Math.max(0.08,Math.min(0.3,(a.s+b.s)*0.14)));
  });

  labels.forEach(lb=>{
    const e=lb.fe.e, a=proj[e.from], b=proj[e.to];
    if(!a||!b){ lb.el.style.display="none"; return; }
    lb.el.style.display="";
    const ca = e.from<e.to ? a : b, cb = e.from<e.to ? b : a;
    let ox=0, oy=0;
    if(lb.off){
      const cdx=cb.x-ca.x, cdy=cb.y-ca.y, cl=Math.sqrt(cdx*cdx+cdy*cdy)||1;
      ox=-cdy/cl*lb.off*1.6; oy=cdx/cl*lb.off*1.6;
    }
    const fpt = e.from===focusId ? a : b, opt = e.from===focusId ? b : a;
    const mx=fpt.x+(opt.x-fpt.x)*lb.frac+ox, my=fpt.y+(opt.y-fpt.y)*lb.frac+oy;
    lb.el.style.transform="translate("+mx+"px,"+my+"px) translate(-50%,-50%)";
  });

  requestAnimationFrame(frame);
}

document.getElementById("newgraph").onclick=()=>{
  if(!confirm("Start a new graph? The current one will be cleared \u2014 Export first if you want to keep it.")) return;
  graphStack=[];
  loadData({title:"Untitled graph", nodes:{n1:{name:"New node"}}, links:[]});
  renderGraphTrail();
  openEditor("n1");
  edName.select();
};

let restored=false;
try{
  const raw=localStorage.getItem(LS_KEY);
  if(raw){ loadData(JSON.parse(raw)); restored=true; }
}catch(err){ restored=false; }
if(!restored){
  loadData(JSON.parse(JSON.stringify(DEFAULT_DATA)));
}
renderGraphTrail();
frame();
</script>
