<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Xanadu — engine</title>
<style>
  :root{
    --page:#070912; --card:rgba(23,26,40,0.82); --line:rgba(255,255,255,0.13);
    --line-strong:rgba(255,255,255,0.22); --t1:#eceef4; --t2:#a7adbe; --t3:#6b7185; --accent:#1D9E75;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--page);color:var(--t1);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;}
  #c{position:fixed;inset:0;display:block;z-index:1;}
  #vig{position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 44%, rgba(1,2,8,0.66) 100%);}
  #label{position:fixed;z-index:4;padding:2px 8px;font-size:12px;color:var(--t1);
    background:rgba(8,10,20,0.72);border:1px solid var(--line);border-radius:8px;white-space:nowrap;
    pointer-events:none;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s;}
  #hud{position:fixed;z-index:5;left:12px;top:12px;background:var(--card);border:1px solid var(--line-strong);
    border-radius:12px;padding:11px 13px;backdrop-filter:blur(3px);min-width:190px;font-size:12px;}
  #hud h1{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:0.01em;color:var(--t1);
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  #hud h1 small{color:var(--t3);font-weight:400;font-size:11px;}
  .stat{display:flex;justify-content:space-between;gap:12px;margin:3px 0;color:var(--t2);}
  .stat b{color:var(--t1);font-weight:600;font-variant-numeric:tabular-nums;}
  .btns{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
  button,select{font:inherit;font-size:12px;background:rgba(0,0,0,0.35);color:var(--t1);
    border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;cursor:pointer;}
  button:active{background:rgba(255,255,255,0.08);}
  #hint{position:fixed;z-index:5;right:12px;bottom:12px;font-size:11px;color:var(--t3);
    background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px;text-align:right;}
  #file{display:none;}
  #cards{position:fixed;inset:0;z-index:3;pointer-events:none;}
  #search{position:relative;margin:7px 0 3px;}
  #q{width:100%;box-sizing:border-box;padding:6px 9px;background:var(--page);border:1px solid var(--line-strong);border-radius:7px;color:var(--t1);font:inherit;font-size:13px;}
  #q::placeholder{color:var(--t3);}
  #results{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:20;background:#171a28;border:1px solid var(--line-strong);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.5);display:none;max-height:210px;overflow-y:auto;}
  #results div{padding:6px 10px;font-size:13px;color:var(--t1);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #results div:hover,#results div.sel{background:rgba(255,255,255,0.09);}
  #results .grp{font-size:10px;color:var(--t3);text-transform:uppercase;margin-left:7px;}
  #legend{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:9px;}
  #legend .leg{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:var(--t2);white-space:nowrap;user-select:none;}
  #legend .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  #editor{position:fixed;top:12px;left:12px;z-index:30;width:min(320px,calc(100vw - 24px));max-height:calc(100vh - 24px);
    overflow:auto;background:#171a28;border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;
    box-shadow:0 14px 44px rgba(0,0,0,0.55);display:none;}
  #editor .edhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;font-size:14px;font-weight:600;color:var(--t1);}
  #editor label{display:block;font-size:11px;color:var(--t2);margin-bottom:9px;text-transform:uppercase;letter-spacing:0.03em;}
  #editor input,#editor textarea,#editor select{width:100%;box-sizing:border-box;margin-top:4px;padding:6px 8px;
    background:var(--page);border:1px solid var(--line-strong);border-radius:7px;color:var(--t1);font:inherit;font-size:13px;text-transform:none;letter-spacing:0;}
  #editor textarea{resize:vertical;line-height:1.4;}
  #editor .edrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  #editor #ed-start-status{font-size:12px;color:var(--t2);}
  #editor #newgroup{display:none;border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;margin:0 0 9px;}
  #cards .card{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;
    transition:left .34s cubic-bezier(.2,.7,.3,1), top .34s cubic-bezier(.2,.7,.3,1), transform .18s, opacity .26s;}
  #cards .card:active{filter:brightness(1.08);}
  #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;display:none;
    background:var(--card);border:1px solid var(--line-strong);border-radius:12px;padding:14px 18px;
    text-align:center;min-width:210px;backdrop-filter:blur(4px);box-shadow:0 8px 30px rgba(0,0,0,0.4);}
  #loading .lt{font-size:13px;color:var(--t1);margin-bottom:10px;font-variant-numeric:tabular-nums;}
  #loading .lbar{height:4px;background:rgba(255,255,255,0.10);border-radius:3px;overflow:hidden;}
  #loading .lfill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s ease;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cards"></div>
<div id="vig"></div>
<div id="label"></div>
<div id="loading"><div class="lt" id="ltxt">Laying out…</div><div class="lbar"><div class="lfill" id="lfill"></div></div></div>
<div id="hud">
  <h1><span id="title">Xanadu</span> <small id="build"></small></h1>
  <div id="search"><input id="q" type="text" placeholder="Search nodes&#8230;" autocomplete="off" spellcheck="false"><div id="results"></div></div>
  <div class="stat"><span>Nodes / links</span><b id="counts">—</b></div>
  <div class="stat"><span>FPS</span><b id="fps">—</b></div>
  <div class="stat"><span>Layout</span><b id="ltime">—</b></div>
  <div class="btns">
    <button id="load">Load JSON</button>
    <button id="example">Example</button>
    <button id="resetview">Reset view</button>
    <select id="synth"><option value="">Synthetic…</option><option>500</option><option>1000</option><option>2500</option><option>5000</option><option>10000</option></select>
  </div>
  <div id="legend"></div>
</div>
<div id="hint">drag to orbit · wheel / pinch to zoom · hover a planet</div>
<input type="file" id="file" accept=".json,application/json">
<div id="editor">
  <div class="edhead"><span>Edit node</span><button id="ed-close">Done</button></div>
  <label>Name<input id="ed-name" autocomplete="off" spellcheck="false"></label>
  <div class="edrow"><button id="ed-set-start">Set as start</button><span id="ed-start-status"></span></div>
  <label>Group<select id="ed-group"></select></label>
  <div id="newgroup">
    <label>Group label<input id="ng-label" placeholder="e.g. Family" autocomplete="off"></label>
    <label>Colour<select id="ng-color"></select></label>
    <button id="ng-create">Create group</button>
  </div>
  <label>Description<textarea id="ed-desc" rows="4" placeholder="Supports **bold**, *italic*, `code`, [links](url)"></textarea></label>
  <label>URL<input id="ed-url" placeholder="https://"></label>
  <label>Link text<input id="ed-linktext" placeholder="Defaults to Wikipedia or Link"></label>
  <label>Video<input id="ed-video" placeholder="YouTube link (optional)"></label>
  <label>Image<input id="ed-img" placeholder="Paste an image address" autocomplete="off"></label>
  <div class="edrow"><button id="ed-upload">Upload image</button><span id="ed-imgstatus" style="display:none;font-size:12px;color:var(--t2);">Uploaded image in use <button id="ed-imgremove" style="font-size:11px;padding:0 7px;">remove</button></span></div>
  <input type="file" id="ed-imgfile" accept="image/*" style="display:none">
</div>

<div id="lightbox" style="display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.78); cursor:zoom-out; align-items:center; justify-content:center;">
  <img id="lightbox-img" alt="" style="max-width:90vw; max-height:90vh; border-radius:12px;">
</div>
<div id="webview" style="display:none; position:fixed; inset:0; z-index:2100; background:rgba(0,0,0,0.55); opacity:0; transition:opacity 0.25s ease; align-items:center; justify-content:center;">
  <div id="webview-panel" style="position:relative; width:min(1100px,94vw); height:min(88vh,900px); background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.5); transform:scale(0.96); transition:transform 0.28s cubic-bezier(.2,.7,.3,1);">
    <div style="display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--card);">
      <span id="webview-title" style="flex:1; font-size:13px; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
      <a id="webview-external" href="#" target="_blank" rel="noopener" style="font-size:12px; color:var(--t2); text-decoration:none; padding:3px 8px;">Open in new tab &#8599;</a>
      <button id="webview-close" type="button" style="font-size:14px; padding:3px 10px;">&times;</button>
    </div>
    <iframe id="webview-frame" style="width:100%; height:calc(100% - 40px); border:0; background:var(--page);" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<script>
"use strict";
/* =============================================================================
   XANADU ENGINE — Phase 2 foundation.
   Layered so each piece scales independently and talks through narrow seams:
     GraphSource → Model → [position buffer] → Layout / Renderer / Interaction.
   No layer reaches across: the renderer never mutates the model, the layout
   never touches the DOM, and all load/save goes through GraphSource. This is
   the structure the scale work (worker layout, Barnes-Hut, accounts) hangs off.
   ============================================================================= */
const BUILD="v2-25";
document.getElementById("build").textContent=BUILD;

/* ---- palette (name → [lightest, mid-dark, darkest, vivid]) ---- */
const PAL={
 purple:["#EEEDFE","#534AB7","#26215C","#7F77DD"], teal:["#E1F5EE","#0F6E56","#04342C","#1D9E75"],
 coral:["#FAECE7","#993C1D","#4A1B0C","#D85A30"], gray:["#F1EFE8","#5F5E5A","#2C2C2A","#888780"],
 blue:["#E6F1FB","#185FA5","#042C53","#378ADD"], pink:["#FBEAF0","#993556","#4B1528","#D4537E"],
 amber:["#FAEEDA","#854F0B","#412402","#EF9F27"], green:["#EAF3DE","#3B6D11","#173404","#97C459"],
 red:["#FCEBEB","#A32D2D","#501313","#E24B4A"], indigo:["#E9E9FB","#3B3F9E","#1A1C4E","#5B60D6"],
 cyan:["#DFF4F8","#0E6E7E","#043339","#1FA6BE"], magenta:["#FBE8F6","#8E2C82","#45153F","#C94FB8"],
 orange:["#FDEBDF","#B4531A","#5A2708","#F2761F"], lime:["#F1F7DD","#5E7A0E","#2E3B04","#B0D53A"],
 brown:["#F3ECE4","#6B4A2E","#331F0F","#9C7248"], slate:["#EAEEF3","#455567","#1F2833","#6E8298"],
 gold:["#FBF3D8","#8A6D0E","#443403","#D4B02A"], rose:["#FCE9EA","#A82B49","#521021","#E85C77"]
};
const PAL_NAMES=Object.keys(PAL);

/* ---- projection / sizing constants (spec §5) ---- */
const F=1150, DIST=1000, R=380;

/* =============================================================================
   MODEL — the graph. Knows nothing about rendering or storage. Exposes the
   node/link data plus derived data (index mapping, degree, edge list, median).
   ============================================================================= */
const Model=(()=>{
  let doc=null, ids=[], idx={}, deg=[], edges=[], medianDeg=1;
  function normalize(d){
    d=d||{}; d.schemaVersion=d.schemaVersion||1;
    d.title=d.title||"Untitled"; d.nodes=d.nodes||{}; d.links=Array.isArray(d.links)?d.links:[];
    d.groups=d.groups||{}; d.types=d.types||{};
    return d;
  }
  function load(d){
    doc=normalize(d);
    ids=Object.keys(doc.nodes);
    idx={}; ids.forEach((id,i)=>idx[id]=i);
    // derived: degree + edge index list (skip links to missing nodes)
    const n=ids.length; deg=new Int32Array(n); edges=[];
    for(const l of doc.links){
      const a=idx[l.from], b=idx[l.to];
      if(a===undefined||b===undefined) continue;
      edges.push(a,b); deg[a]++; deg[b]++;
    }
    const dv=Array.from(deg).filter(x=>x>0).sort((p,q)=>p-q);
    medianDeg=Math.max(1, dv.length?dv[dv.length>>1]:1);
  }
  function colorName(id){
    const g=doc.nodes[id]&&doc.nodes[id].group;
    const gc=g&&doc.groups[g]&&doc.groups[g].color;
    return (gc&&PAL[gc])?gc:"gray";
  }
  return {
    load, normalize,
    get raw(){return doc;},
    get ids(){return ids;},
    nodeById:(id)=>doc.nodes[id],
    index:(id)=>idx[id],
    count:()=>ids.length,
    degOf:(i)=>deg[i]||0,
    edges:()=>edges,           // flat [a0,b0,a1,b1,...] of node indices
    median:()=>medianDeg,
    title:()=>doc.title,
    start:()=>doc.start,
    colorName
  };
})();

/* =============================================================================
   GRAPHSOURCE — one interface for all graph I/O. Only local implementations
   exist now; a RemoteSource (accounts) slots in behind the same shape later.
   ============================================================================= */
const LS_KEY="relation-explorer-data";
const LocalStorageSource={
  load(){ try{ const s=localStorage.getItem(LS_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } },
  save(doc){ try{ localStorage.setItem(LS_KEY, JSON.stringify(doc)); }catch(e){} }
};
const FileSource={
  pick(){ return new Promise(res=>{
    const inp=document.getElementById("file");
    inp.value=""; inp.onchange=()=>{
      const f=inp.files[0]; if(!f){ res(null); return; }
      const r=new FileReader();
      r.onload=()=>{ try{ res(JSON.parse(r.result)); }catch(e){ alert("Could not parse that JSON."); res(null); } };
      r.readAsText(f);
    };
    inp.click();
  }); }
};

/* =============================================================================
   POSITION BUFFER — the central seam. Layout is the only writer; Renderer and
   hit-testing are readers. Flat typed arrays, addressed by node index.
   ============================================================================= */
const Positions={
  x:new Float32Array(0), y:new Float32Array(0), z:new Float32Array(0),
  ensure(n){ if(this.x.length!==n){ this.x=new Float32Array(n); this.y=new Float32Array(n); this.z=new Float32Array(n); } }
};

/* =============================================================================
   LAYOUT — force simulation (exact algorithm + constants from the prototype,
   §5). Reads Model, writes Positions. Main-thread for now; moves to a Web
   Worker in Phase 3 without changing this contract.
   ============================================================================= */
const Layout=(()=>{
  function seededUnit(str){
    let h=2166136261>>>0;
    for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
    const a=(h>>>0)/4294967295;
    h^=h<<13; h^=h>>>17; h^=h<<5; h>>>=0; const b=(h>>>0)/4294967295;
    h^=h<<13; h^=h>>>17; h^=h<<5; h>>>=0; const c=(h>>>0)/4294967295;
    return [a*2-1, b*2-1, c*2-1];
  }
  // seed deterministic starting positions into the buffer (fast, shown immediately)
  function seedInto(){
    const ids=Model.ids, n=ids.length; Positions.ensure(n);
    const px=Positions.x, py=Positions.y, pz=Positions.z;
    for(let i=0;i<n;i++){ const u=seededUnit(String(ids[i])); px[i]=u[0]*R; py[i]=u[1]*R; pz[i]=u[2]*R; }
  }
  // The force simulation — identical algorithm and constants to the prototype (§5). Written as a
  // string so it runs BOTH in a Web Worker (off the main thread; streams progress) and, as a
  // fallback, synchronously on the main thread when workers aren't available (e.g. file://).
  const SIM=`function sim(n, edges, px, py, pz, emit, finish){
    if(n<=1) { finish(); return; }
    var K=180, REP=K*K*2.2, iters=n>200?90:240, STEP=Math.max(1,(iters/24)|0), m=edges.length/2, i,j,e,it,o;
    var adj=[]; for(i=0;i<n;i++) adj[i]=new Set();
    for(var k=0;k<edges.length;k+=2){ adj[edges[k]].add(edges[k+1]); adj[edges[k+1]].add(edges[k]); }
    var eL=new Float64Array(m), eK=new Float64Array(m);
    for(e=0;e<m;e++){ var a=edges[e*2],b=edges[e*2+1],sa=adj[a],sb=adj[b];
      var small=sa.size<sb.size?sa:sb, big=sa.size<sb.size?sb:sa, shared=0;
      small.forEach(function(v){ if(v!==a&&v!==b&&big.has(v)) shared++; });
      eL[e]=Math.max(K*0.5,K/(1+0.28*shared)); eK[e]=0.3*(1+0.22*shared); }
    var dx=new Float64Array(n),dy=new Float64Array(n),dz=new Float64Array(n);
    // Repulsion: Barnes-Hut octree (O(n log n), approximate) for large graphs; exact all-pairs
    // (O(n^2)) below the threshold so small graphs match the prototype layout exactly.
    var BH = n>400, theta2=0.9*0.9, MAXD=28, CAP=n*2+64, CN=0;
    var gcx,gcy,gcz,ghs,mass,mmx,mmy,mmz,leafBody,leafHead,child,bodyNext,stack;
    if(BH){
      gcx=new Float64Array(CAP);gcy=new Float64Array(CAP);gcz=new Float64Array(CAP);ghs=new Float64Array(CAP);
      mass=new Int32Array(CAP);mmx=new Float64Array(CAP);mmy=new Float64Array(CAP);mmz=new Float64Array(CAP);
      leafBody=new Int32Array(CAP);leafHead=new Int32Array(CAP);child=new Int32Array(CAP*8);
      bodyNext=new Int32Array(n);stack=new Int32Array(CAP+16);
    }
    function newCell(p,oc){ var c=CN++, hs2=ghs[p]*0.5;
      gcx[c]=gcx[p]+((oc&1)?hs2:-hs2); gcy[c]=gcy[p]+((oc&2)?hs2:-hs2); gcz[c]=gcz[p]+((oc&4)?hs2:-hs2);
      ghs[c]=hs2; mass[c]=0; mmx[c]=0; mmy[c]=0; mmz[c]=0; leafBody[c]=-1; leafHead[c]=-1;
      for(var q=0;q<8;q++) child[c*8+q]=-1; return c; }
    function insert(bi){ var c=0, d=0;
      while(true){
        mass[c]++; mmx[c]+=px[bi]; mmy[c]+=py[bi]; mmz[c]+=pz[bi];
        if(mass[c]===1){ leafBody[c]=bi; return; }
        if(leafBody[c]>=0){ var b2=leafBody[c]; leafBody[c]=-1;
          if(d>=MAXD){ leafHead[c]=b2; bodyNext[b2]=-1; }
          else { var o2=(px[b2]>gcx[c]?1:0)|(py[b2]>gcy[c]?2:0)|(pz[b2]>gcz[c]?4:0), ch2=child[c*8+o2];
            if(ch2<0){ ch2=newCell(c,o2); child[c*8+o2]=ch2; }
            mass[ch2]++; mmx[ch2]+=px[b2]; mmy[ch2]+=py[b2]; mmz[ch2]+=pz[b2]; leafBody[ch2]=b2; } }
        if(d>=MAXD){ bodyNext[bi]=leafHead[c]; leafHead[c]=bi; return; }
        var oo=(px[bi]>gcx[c]?1:0)|(py[bi]>gcy[c]?2:0)|(pz[bi]>gcz[c]?4:0), ch=child[c*8+oo];
        if(ch<0){ ch=newCell(c,oo); child[c*8+oo]=ch; }
        c=ch; d++;
      } }
    function buildTree(){
      var minx=1e30,miny=1e30,minz=1e30,maxx=-1e30,maxy=-1e30,maxz=-1e30,x,y,z;
      for(i=0;i<n;i++){ x=px[i];y=py[i];z=pz[i]; if(x<minx)minx=x;if(y<miny)miny=y;if(z<minz)minz=z; if(x>maxx)maxx=x;if(y>maxy)maxy=y;if(z>maxz)maxz=z; }
      CN=1; gcx[0]=(minx+maxx)*0.5; gcy[0]=(miny+maxy)*0.5; gcz[0]=(minz+maxz)*0.5;
      ghs[0]=Math.max(maxx-minx,maxy-miny,maxz-minz)*0.5+1; mass[0]=0; mmx[0]=0; mmy[0]=0; mmz[0]=0; leafBody[0]=-1; leafHead[0]=-1;
      for(o=0;o<8;o++) child[o]=-1;
      for(i=0;i<n;i++) insert(i);
    }
    function force(bi){ var sp=0; stack[sp++]=0;
      while(sp>0){ var c=stack[--sp], lb=leafBody[c];
        if(lb>=0){ if(lb!==bi){ var vx=px[bi]-px[lb],vy=py[bi]-py[lb],vz=pz[bi]-pz[lb],q2=vx*vx+vy*vy+vz*vz; if(q2<1)q2=1; var qd=Math.sqrt(q2),qf=REP/q2; dx[bi]+=vx/qd*qf; dy[bi]+=vy/qd*qf; dz[bi]+=vz/qd*qf; } continue; }
        var mc=mass[c]; if(mc===0) continue;
        var comx=mmx[c]/mc, comy=mmy[c]/mc, comz=mmz[c]/mc, ddx=px[bi]-comx, ddy=py[bi]-comy, ddz=pz[bi]-comz, d2=ddx*ddx+ddy*ddy+ddz*ddz; if(d2<1)d2=1;
        var s=ghs[c]*2;
        if(s*s < theta2*d2){ var dd=Math.sqrt(d2), f=REP*mc/d2; dx[bi]+=ddx/dd*f; dy[bi]+=ddy/dd*f; dz[bi]+=ddz/dd*f; }
        else { var lh=leafHead[c];

function neighboursOf(id){
  const raw=Model.raw, types=raw.types||{}, seen={}, out=[];
  for(const l of raw.links){
    let other=null, rel=null, dir=0; const t=types[l.type]||{mutual:true}; const directional=!t.mutual && t.arrow!==false;
    if(l.from===id){ other=l.to; rel=t.mutual?(t.label||l.type):(t.toLabel||t.label||l.type); if(directional) dir=1; }
    else if(l.to===id){ other=l.from; rel=t.mutual?(t.label||l.type):(t.fromLabel||t.label||l.type); if(directional) dir=-1; }
    if(other && Model.nodeById(other)){
      if(!seen[other]){ seen[other]={id:other, rels:[], dir:0, dashed:false}; out.push(seen[other]); }
      if(rel && seen[other].rels.indexOf(rel)<0) seen[other].rels.push(rel);
      if(dir!==0 && seen[other].dir===0) seen[other].dir=dir;   // +1 arrow points out (focus→nbr), -1 in
      if(t.dashed) seen[other].dashed=true;

function buildFocusCards(){
  const host=document.getElementById("cards"); host.innerHTML="";
  if(Focus.mode!=="focus"||!Focus.id) return;
  const W=innerWidth, H=innerHeight, CX=W/2, CY=H/2;
  const nbrs=Focus.neighbours, N=nbrs.length;
  const crowd=N<=8?1:Math.max(0.6, 1-(N-8)*0.03), manyNbr=N>14;
  const topInset=18, botInset=18;   // reserve slim bands top/bottom
  // --- pass 1: create + append every card (positions written later, in one batch) ---
  const fc=makeCard(Focus.id, true, null, true);
  fc.style.left=CX+"px"; fc.style.top=CY+"px"; host.appendChild(fc);
  const hd=fc.querySelector(".hidefocus"); if(hd) hd.onclick=(ev)=>{ ev.stopPropagation(); exitFocus(); };
  fc.addEventListener("dblclick", ()=>openEditor(Focus.id));
  attachLongPress(fc, ()=>openEditor(Focus.id));
  const cards=[];
  for(let k=0;k<N;k++){ const card=makeCard(nbrs[k].id, false, nbrs[k].rel, !manyNbr); host.appendChild(card); cards.push(card); }
  // --- pass 2: measure everything together (one reflow) ---
  const fw=fc.offsetWidth, fh=fc.offsetHeight;
  const sz=cards.map(c=>({w:c.offsetWidth, h:c.offsetHeight}));
  // --- pass 3: place each neighbour by the prototype's geometry (never covers the central card) ---
  const layout={ fx:CX, fy:CY, fw, fh, nbrs:[] };
  const Lb=0, Rb=W, Tb=topInset, Bb=H-botInset, targets=[];
  fc.style.opacity="0";
  for(let k=0;k<N;k++){
    const ang=-Math.PI/2 + 2*Math.PI*k/N, dx=Math.cos(ang), dy=Math.sin(ang), axr=Math.abs(dx), ayr=Math.abs(dy);
    const nw=sz[k].w, nh=sz[k].h; let nvs=crowd;
    // beside a wide central card: shrink to fit the gap between the card edge and the screen edge
    if(axr>ayr && nw>1){ const gapHalf=(W/2 - fw/2 - 10)/2, maxNvs=(gapHalf-6)/(nw/2); if(maxNvs<nvs) nvs=Math.max(0.42, maxNvs); }
    const hw=nw/2*nvs+6, hh=nh/2*nvs+6;
    const availX=Math.max(20, W/2-hw), availUp=Math.max(20, H/2-hh-topInset), availDn=Math.max(20, H/2-hh-botInset);
    const tX=axr>1e-4?availX/axr:Infinity, tY=ayr>1e-4?(dy<0?availUp:availDn)/ayr:Infinity;
    let t=Math.min(tX,tY), tx=CX+dx*t, ty=CY+dy*t;
    const cardHalfW=fw/2+hw+8, cardHalfH=fh/2+hh+8;
    if(Math.abs(tx-CX)<cardHalfW && Math.abs(ty-CY)<cardHalfH){
      const ts=Math.min(cardHalfW/Math.max(1e-4,axr), cardHalfH/Math.max(1e-4,ayr)); tx=CX+dx*ts; ty=CY+dy*ts;
    }
    if(tx-hw<Lb) tx=Lb+hw; else if(tx+hw>Rb) tx=Rb-hw;
    if(ty-hh<Tb) ty=Tb+hh; else if(ty+hh>Bb) ty=Bb-hh;
    if(Math.abs(tx-CX)<cardHalfW && Math.abs(ty-CY)<cardHalfH){
      const dir=dy<=0?-1:1; ty=Math.max(Tb+hh, Math.min(Bb-hh, CY+dir*cardHalfH));
    }
    const card=cards[k], nid=nbrs[k].id;
    // start at the centre, invisible; glide out to target on the next frame (CSS transition)
    card.style.left=CX+"px"; card.style.top=CY+"px"; card.style.opacity="0";
    card.style.transform="translate(-50%,-50%) scale("+nvs.toFixed(3)+")";
    card.onclick=()=>{ if(card._lp){ card._lp=false; return; } enterFocus(nid); };
    card.addEventListener("dblclick", (ev)=>{ ev.stopPropagation(); openEditor(nid); });
    attachLongPress(card, ()=>openEditor(nid));
    targets.push({card, tx, ty});
    layout.nbrs.push({ id:nid, x:tx, y:ty, w:nw*nvs, h:nh*nvs, dir:nbrs[k].dir, dashed:nbrs[k].dashed });
  }
  Focus.layout=layout; Focus.t0=(typeof performance!=="undefined"?performance.now():Date.now());
  const paint=()=>{ fc.style.opacity="1"; for(const t of targets){ t.card.style.left=t.tx+"px"; t.card.style.top=t.ty+"px"; t.card.style.opacity="1"; } };
  if(typeof requestAnimationFrame!=="undefined") requestAnimationFrame(()=>requestAnimationFrame(paint)); else paint();
}

function synthGraph(n){
  const nodes={}, links=[], groups={}, types={link:{label:"link",mutual:true}};
  PAL_NAMES.forEach(nm=>groups["g_"+nm]={label:nm,color:nm});
  let s=99991; const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  for(let i=0;i<n;i++) nodes["n"+i]={name:"Node "+i, group:"g_"+PAL_NAMES[(rnd()*PAL_NAMES.length)|0]};
  const targets=[0,0,0];
  for(let i=1;i<n;i++){ const picks=new Set();
    for(let k=0;k<2&&targets.length;k++){ const t=targets[(rnd()*targets.length)|0]; if(t!==i&&!picks.has(t)) picks.add(t); }
    picks.forEach(t=>{ links.push({from:"n"+i,to:"n"+t,type:"link"}); targets.push(i,t); }); }

const qEl=document.getElementById("q"), resultsEl=document.getElementById("results");

function runSearch(){
  const term=qEl.value.trim().toLowerCase();
  resultsEl.innerHTML=""; qMatches=[]; qSel=-1;
  if(!term){ resultsEl.style.display="none"; return; }
  const ids=Model.ids, n=Model.count(), hits=[];
  for(let i=0;i<n && hits.length<60;i++){ const nd=Model.nodeById(ids[i]), nm=(nd&&nd.name)||ids[i];
    if(nm.toLowerCase().indexOf(term)>=0) hits.push({id:ids[i], name:nm, group:nd&&nd.group}); }
  hits.sort((a,b)=>{ const ap=a.name.toLowerCase().startsWith(term)?0:1, bp=b.name.toLowerCase().startsWith(term)?0:1; return ap-bp || a.name.localeCompare(b.name); });
  qMatches=hits.slice(0,10);
  if(!qMatches.length){ resultsEl.style.display="none"; return; }
  qMatches.forEach(m=>{ const d=document.createElement("div"); const g=m.group&&(Model.raw.groups||{})[m.group];
    d.innerHTML=esc(m.name)+(g&&g.label?'<span class="grp">'+esc(g.label)+'</span>':"");

  el.addEventListener("pointermove", e=>{ if(t && (Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy))>8) clear(); });

  Object.keys(groups).forEach(k=>{ const o=document.createElement("option"); o.value=k; o.textContent=groups[k].label||k; gsel.appendChild(o); });
  const nw=document.createElement("option"); nw.value="__new"; nw.textContent="+ New group\u2026"; gsel.appendChild(nw);
  gsel.value=sel||""; document.getElementById("newgroup").style.display="none";
}

document.getElementById("ed-group").addEventListener("change", ()=>{
  if(document.getElementById("ed-group").value==="__new"){ document.getElementById("newgroup").style.display=""; document.getElementById("ng-label").focus(); return; }
  applyEdit();
});
document.getElementById("ng-create").onclick=()=>{
  const lbl=document.getElementById("ng-label").value.trim(); if(!lbl){ alert("Give the group a label"); return; }
  const groups=Model.raw.groups=Model.raw.groups||{}, key=slugKey(lbl, groups);
  groups[key]={label:lbl, color:document.getElementById("ng-color").value};
  document.getElementById("ng-label").value="";
  refreshGroupSelect(key);
  if(editingId) Model.nodeById(editingId).group=key;
  LocalStorageSource.save(Model.raw); Renderer.refresh(); rebuildVis(); buildLegend();
  if(Focus.mode==="focus") buildFocusCards();
};

  document.getElementById("ed-imgstatus").style.display=isData?"":"none";

/* ---- render loop ---- */
let fpsT=performance.now(), fpsN=0;
function loop(){
  view.dist += (view.tdist-view.dist)*0.12;
  view.cx += (view.tcx-view.cx)*0.1; view.cy += (view.tcy-view.cy)*0.1; view.cz += (view.tcz-view.cz)*0.1;
  if(!dragging) view.yaw += view.spin;
  Renderer.frame(view);
  fpsN++; const now=performance.now();
  if(now-fpsT>=500){ const fps=Math.round(fpsN*1000/(now-fpsT)); fpsN=0; fpsT=now;
    const el=document.getElementById("fps"); el.textContent=fps; el.style.color=fps>=55?"#8fd3a8":fps>=35?"#e6c15a":"#e07a6a"; }
  requestAnimationFrame(loop);
}

ersephone":{"name":"Persephone","group":"oly","desc":"Queen of the underworld; spring","url":"https://en.wikipedia.org/wiki/Persephone"},"maia":{"name":"Maia","group":"nymph","desc":"Nymph, eldest of the Pleiades","url":"https://en.wikipedia.org/wiki/Maia"},"semele":{"name":"Semele","group":"mort","desc":"Mortal princess of Thebes","url":"https://en.wikipedia.org/wiki/Semele"},"helios":{"name":"Helios","group":"titan","desc":"The sun Titan. His sacred cattle, eaten by starving crewmen against explicit warning, cost the whole crew their lives.","url":"https://en.wikipedia.org/wiki/Helios"},"odysseus":{"name":"Odysseus","group":"greek","desc":"King of Ithaca. Ten years fighting at Troy, ten more getting home — *the man of twists and turns*. Slower to speak than to think, which is the whole point.","url":"https://en.wikipedia.org/wiki/Odysseus"},"penelope":{"name":"Penelope","group":"greek","desc":"Odysseus's wife. Holds off 108 suitors for years by weaving a burial shroud all day and unpicking it every night.","url":"https://en.wikipedia.org/wiki/Penelope"},"telemachus":{"name":"Telemachus","group":"greek","desc":"Their son. Spends the poem's first act growing up — travels to Pylos and Sparta chasing news of a father he barely remembers.","url":"https://en.wikipedia.org/wiki/Telemachus"},"laertes":{"name":"Laertes","group":"greek","desc":"Odysseus's father. Living out his old age tending an orchard, half-grieving a son everyone else has given up on.","url":"https://en.wikipedia.org/wiki/Laertes"},"nestor":{"name":"Nestor","group":"greek","desc":"Aged king of Pylos, veteran of Troy. Long-winded but well-meaning — has no real news of Odysseus, but plenty of advice.","url":"https://en.wikipedia.org/wiki/Nestor_(mythology)"},"menelaus":{"name":"Menelaus","group":"greek","desc":"King of Sparta, Helen's husband. Also took ten years to sail home from Troy — tells Telemachus so over a lavish dinner.","url":"https://en.wikipedia.org/wiki/Menelaus"},"helen":{"name":"Helen","group":"greek","desc":"Whose face launched the whole Trojan War, now settled back into married life at Sparta as if nothing happened.","url":"https://en.wikipedia.org/wiki/Helen_of_Troy"},"eumaeus":{"name":"Eumaeus","group":"greek","desc":"Odysseus's loyal swineherd. Shelters his disguised, unrecognised master without knowing who he is — loyalty as its own reward.","url":"https://en.wikipedia.org/wiki/Eumaeus"},"antinous":{"name":"Antinous","group":"greek","desc":"The boldest and rudest of Penelope's suitors, busy eating Odysseus out of house and home. First to die when the bow comes out.","url":"https://en.wikipedia.org/wiki/Antinous_(suitor)"},"nausicaa":{"name":"Nausicaa","group":"greek","desc":"Phaeacian princess. Finds the shipwrecked, naked Odysseus on the beach and, with impressive composure, doesn't run.","url":"https://en.wikipedia.org/wiki/Nausicaa"},"alcinous":{"name":"Alcinous","group":"greek","desc":"Nausicaa's father, king of the Phaeacians. Hosts Odysseus, hears his whole story, and finally ships him home.","url":"https://en.wikipedia.org/wiki/Alcinous"},"tiresias":{"name":"Tiresias","group":"greek","desc":"Blind prophet, dead and consulted in the underworld anyway. Tells Odysseus exactly what's coming — he mostly ignores it.","url":"https://en.wikipedia.org/wiki/Tiresias"},"circe":{"name":"Circe","group":"nymph","desc":"Enchantress on Aeaea. Turns Odysseus's crew into pigs, then — once he resists her — becomes an unexpectedly helpful host for a year.","url":"https://en.wikipedia.org/wiki/Circe"},"calypso":{"name":"Calypso","group":"nymph","desc":"Nymph who keeps Odysseus on her island for **seven years**, offering immortality if he'll stay. He still wants to go home.","url":"https://en.wikipedia.org/wiki/Calypso_(mythology)"},"polyphemus":{"name":"Polyphemus","group":"monster","desc":"One-eyed son of Poseidon. Traps Odysseus's crew in his cave and eats several before a red-hot stake and a fake name (\"Nobody\") end the standoff.","url":"https://en.wikipedia.org/wiki/Polyphemus"},"scylla":{"name":"Scylla","group":"monster","desc":"Six-headed monster in a narrow strait. Odysseus sails close to her rather than risk Charybdis — she still takes six men.","url":"https://en.wikipedia.org/wiki/Scylla"},"charybdis":{"name":"Charybdis","group":"monster","desc":"A whirlpool opposite Scylla. Swallows the sea three times a day; the safer-looking choice that turns out not to be.","url":"https://en.wikipedia.org/wiki/Charybdis"},"sirens":{"name":"Sirens","group":"monster","desc":"Singers whose voices lure sailors to wreck on the rocks. Odysseus has himself lashed to the mast just to hear them safely.","url":"https://en.wikipedia.org/wiki/Siren_(mythology)"},"thetis":{"name":"Thetis","group":"nymph","desc":"A sea nymph, Achilles' mother. Carries his grievances to Zeus and his armour back from Hephaestus.","url":"https://en.wikipedia.org/wiki/Thetis"},"achilles":{"name":"Achilles","group":"greek","desc":"Greatest of the Greek fighters. The whole poem is technically about *one* of his tempers — the one where he sits out the war over a woman he was made to give up.","url":"https://en.wikipedia.org/wiki/Achilles"},"agamemnon":{"name":"Agamemnon","group":"greek","desc":"Commander of the Greek host. Starts the plot by claiming Achilles' captive, which is either kingly prerogative or spectacularly poor judgement depending who's asked.","url":"https://en.wikipedia.org/wiki/Agamemnon"},"ajax":{"name":"Ajax","group":"greek","desc":"\"The Great.\" Second only to Achilles in raw fighting strength; duels Hector to an honourable draw.","url":"https://en.wikipedia.org/wiki/Ajax_the_Great"},"diomedes":{"name":"Diomedes","group":"greek","desc":"Young Greek spearman having the single best day of anyone in the poem — wounds two Olympians and lives to tell it.","url":"https://en.wikipedia.org/wiki/Diomedes"},"patroclus":{"name":"Patroclus","group":"greek","desc":"Achilles' closest companion. Borrows his armour to rally the Greeks, and pays for it.","url":"https://en.wikipedia.org/wiki/Patroclus"},"briseis":{"name":"Briseis","group":"greek","desc":"Captive woman awarded to Achilles as a war-prize, then seized by Agamemnon — the spark, not really the subject, of the poem's central quarrel.","url":"https://en.wikipedia.org/wiki/Briseis"},"hector":{"name":"Hector","group":"trojan","desc":"Troy's best defender and its clearest head — fights a war he privately suspects is already lost, because someone has to.","url":"https://en.wikipedia.org/wiki/Hector"},"priam":{"name":"Priam","group":"trojan","desc":"Aged king of Troy. Ends the poem begging Achilles, his son's killer, for the body back — and gets it.","url":"https://en.wikipedia.org/wiki/Priam"},"paris":{"name":"Paris","group":"trojan","desc":"Took Helen, started the war, then spends most of it as a considerably less impressive soldier than his brother.","url":"https://en.wikipedia.org/wiki/Paris_(mythology)"},"andromache":{"name":"Andromache","group":"trojan","desc":"Hector's wife. Their farewell scene, with their infant son, is the poem's quietest and most devastating moment.","url":"https://en.wikipedia.org/wiki/Andromache"},"heracles":{"group":"hero","name":"Heracles","desc":"Greatest of the Greek heroes; performed the Twelve Labours to atone for a madness sent by Hera.","url":"https://en.wikipedia.org/wiki/Heracles"},"perseus":{"group":"hero","name":"Perseus","desc":"Slew the Gorgon Medusa and rescued Andromeda from the sea monster Cetus.","url":"https://en.wikipedia.org/wiki/Perseus"},"theseus":{"group":"hero","name":"Theseus","desc":"Athenian hero who slew the Minotaur in the Labyrinth of Crete.","url":"https://en.wikipedia.org/wiki/Theseus"},"jason":{"group":"hero","name":"Jason","desc":"Led the Argonauts aboard the *Argo* to win the Golden Fleece.","url":"https://en.wikipedia.org/wiki/Jason"},"bellerophon":{"group":"hero","name":"Bellerophon","desc":"Tamed the winged horse Pegasus and slew the Chimera.","url":"https://en.wikipedia.org/wiki/Bellerophon"},"orpheus":{"group":"hero","name":"Orpheus","desc":"Musician whose songs charmed all; descended to the Underworld to reclaim Eurydice.","url":"https://en.wikipedia.org/wiki/Orpheus"},"atalanta":{"group":"hero","name":"Atalanta","desc":"Swift huntress who joined the Calydonian boar hunt and the Argonauts.","url":"https://en.wikipedia.org/wiki/Atalanta"},"daedalus":{"group":"hero","name":"Daedalus","desc":"Master craftsman who built the Labyrinth and wings of wax and feathers.","url":"https://en.wikipedia.org/wiki/Daedalus"},"oedipus":{"group":"hero","name":"Oedipus","desc":"Solved the Sphinx's riddle, then unknowingly fulfilled the prophecy to kill his father and wed his mother.","url":"https://en.wikipedia.org/wiki/Oedipus"},"cadmus":{"group":"hero","name":"Cadmus","desc":"Founder of Thebes; sowed dragon's teeth that sprang up as warriors.","url":"https://en.wikipedia.org/wiki/Cadmus"},"meleager":{"group":"hero","name":"Meleager","desc":"Hero who led the hunt for the Calydonian Boar.","url":"https://en.wikipedia.org/wiki/Meleager"},"castor":{"group":"hero","name":"Castor","desc":"One of the Dioscuri twins; a peerless horseman.","url":"https://en.wikipedia.org/wiki/Castor_and_Pollux"},"pollux":{"group":"hero","name":"Pollux","desc":"One of the Dioscuri twins; an immortal boxer.","url":"https://en.wikipedia.org/wiki/Castor_and_Pollux"},"eros":{"group":"deity","name":"Eros","desc":"God of love and desire, whose arrows compel gods and mortals alike.","url":"https://en.wikipedia.org/wiki/Eros"},"pan":{"group":"deity","name":"Pan","desc":"Goat-legged god of the wild, of shepherds and rustic music.","url":"https://en.wikipedia.org/wiki/Pan_(god)"},"iris":{"group":"deity","name":"Iris","desc":"Goddess of the rainbow and swift messenger of the gods.","url":"https://en.wikipedia.org/wiki/Iris_(mythology)"},"nike":{"group":"deity","name":"Nike","desc":"Winged goddess of victory.","url":"https://en.wikipedia.org/wiki/Nike_(mythology)"},"hebe":{"group":"deity","name":"Hebe","desc us"},"medea":{"group":"mort","name":"Medea","desc":"Sorceress of Colchis who helped Jason win the Fleece.","url":"https://en.wikipedia.org/wiki/Medea"},"aeetes":{"group":"mort","name":"Aeetes","desc":"King of Colchis who guarded the Golden Fleece.","url":"https://en.wikipedia.org/wiki/Aeetes"},"pelias":{"group":"mort","name":"Pelias","desc":"Usurper who sent Jason after the Fleece.","url":"https://en.wikipedia.org/wiki/Pelias"},"jocasta":{"group":"mort","name":"Jocasta","desc":"Queen of Thebes; mother and unwitting wife of Oedipus.","url":"https://en.wikipedia.org/wiki/Jocasta"},"laius":{"group":"mort","name":"Laius","desc":"King of Thebes, slain at a crossroads by his son Oedipus.","url":"https://en.wikipedia.org/wiki/Laius"},"antigone":{"group":"mort","name":"Antigone","desc":"Daughter of Oedipus who defied the king to bury her brother.","url":"https://en.wikipedia.org/wiki/Antigone"},"andromeda":{"group":"mort","name":"Andromeda","desc":"Princess chained to a rock and rescued by Perseus.","url":"https://en.wikipedia.org/wiki/Andromeda_(mythology)"},"cepheus":{"group":"mort","name":"Cepheus","desc":"King of Aethiopia and father of Andromeda.","url":"https://en.wikipedia.org/wiki/Cepheus,_King_of_Aethiopia"},"cassiopeia":{"group":"mort","name":"Cassiopeia","desc":"Vain queen whose boast doomed her daughter Andromeda.","url":"https://en.wikipedia.org/wiki/Cassiopeia_(mother_of_Andromeda)"},"clytemnestra":{"group":"mort","name":"Clytemnestra","desc":"Wife of Agamemnon, who murdered him on his return from Troy.","url":"https://en.wikipedia.org/wiki/Clytemnestra"},"deianira":{"group":"mort","name":"Deianira","desc":"Third wife of Heracles, whose gift unwittingly killed him.","url":"https://en.wikipedia.org/wiki/Deianira"},"iolaus":{"group":"mort","name":"Iolaus","desc":"Nephew and charioteer of Heracles, who helped slay the Hydra.","url":"https://en.wikipedia.org/wiki/Iolaus"},"eurystheus":{"group":"mort","name":"Eurystheus","desc":"King who imposed the Twelve Labours
